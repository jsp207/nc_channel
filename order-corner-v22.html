<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --page:#ebeef6;--surface:#fff;--surface-2:#f8f9fb;--line:#e8ecef;--line-strong:#d3d8e0;
  --text:#1a1a1a;--sub:#454f59;--muted:#6b7280;--faint:#a3a9b5;
  --accent:#3617ce;--accent-soft:#eeebfd;
  --blue-bg:#e6efff;--blue-fg:#2d5fd9;--green-bg:#e3f6ea;--green-fg:#1f8a4c;
  --grey-bg:#eceef3;--grey-fg:#5d6275;--orange-bg:#fff0de;--orange-fg:#c46a0b;--purple-bg:#efe8ff;--purple-fg:#6a3fd4;
  --red:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.faint{color:var(--faint)}
/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.lnb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px 0}
.lnb-h{display:flex;align-items:center;gap:8px;padding-bottom:18px}
.lnb-logo{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center}
.lnb-logo svg{width:15px;height:15px}
.lnb-h b{font-size:15px}
.lnb-nav{flex:1;overflow-y:auto}
.lnb-g{font-size:12px;color:var(--muted);padding:0 12px;margin:22px 0 6px}
.lnb-i{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;font-size:13px;color:#2b2f3a;text-decoration:none}
.lnb-i svg{width:16px;height:16px;color:var(--sub)}
.lnb-i.on{background:#fff;color:var(--accent);font-weight:700}
.lnb-i.on svg{color:var(--accent)}
.lnb-i .nw{margin-left:auto;font-size:10px;font-weight:700;color:var(--orange-fg);border:1px solid #f3b36b;background:var(--orange-bg);border-radius:10px;padding:0 6px}
.lnb-f{border-top:1px solid #dfe3ea;margin:0 -12px;padding:12px 0 14px;text-align:center;font-size:11.5px;color:var(--muted)}
.main{padding:18px 20px 40px 0;min-width:0}
.sheet{background:var(--surface);border-radius:24px;padding:44px 48px;min-height:calc(100vh - 36px)}
.crumb{font-size:12px;color:var(--sub)}
.crumb span+span::before{content:">";margin:0 7px;color:var(--sub)}
h1{font-size:20px;margin:8px 0 0;letter-spacing:-.01em}
.hr{height:1px;background:var(--line);margin:20px 0 22px}
/* tabs (BO 스타일) */
.tt{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tt button{border:0;background:none;padding:0 18px 12px;margin-bottom:-1px;cursor:pointer;color:var(--sub);font-size:15px;font-weight:700;border-bottom:2px solid transparent}
.tt button.on{color:var(--accent);border-color:var(--accent)}
/* search (SB corner-type-search 기준) */
.srch{display:flex;align-items:center;background:#f6f7f9;border-radius:12px;padding:24px;min-height:86px;gap:0}
.sg{display:flex;align-items:center;gap:10px;padding:0 12px;border-left:1px solid var(--line);flex:none}
.sg.kw{flex:1 1 auto;min-width:0}
.sg:first-child{padding-left:0;border-left:0}
.sgl{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.rds{display:flex;align-items:center;gap:8px}
.rds label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--faint);cursor:pointer;white-space:nowrap}
.rds label:has(input:checked){color:var(--text);font-weight:600}
.rds input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.ss{position:relative;width:200px;flex:none}
.ss select{appearance:none;-webkit-appearance:none;width:100%;height:38px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;padding:0 36px 0 13px;font-size:13px;cursor:pointer}
.ss svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text)}
.si{position:relative;width:300px;min-width:140px;flex:0 1 300px;margin-left:12px}
.si input{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;padding:0 34px 0 13px;font-size:13px}
.si input::placeholder{color:var(--faint)}
.si button{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:0;border-radius:50%;background:#b9bec8;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.sa{display:flex;gap:8px;margin-left:auto;padding-left:12px;flex:none}
.sbtn{height:38px;padding:0 14px;border-radius:6px;border:1px solid #1a1a1a;background:#fff;cursor:pointer;font-size:13px;font-weight:500}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
/* result */
.rh{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 0 12px}
.rh h2{margin:0;font-size:18px}.rh h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}.rh h2 b{color:var(--text)}
table.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{background:var(--surface-2);border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);padding:11px 8px;font-weight:600;color:var(--sub);text-align:center;white-space:nowrap}
.lt td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle;color:var(--sub)}
.lt td.l{text-align:left;min-width:150px}
.lt td.mono{white-space:nowrap}
.lt tbody tr:hover td{background:#fafaff}
.lt .lnk{color:var(--text);font-weight:500}
/* 상세 이동은 코너 ID 링크로만 */
.lt a.cid{color:var(--accent);text-decoration:none;cursor:pointer}
.lt a.cid:hover{text-decoration:underline}
.lt td.dt{white-space:nowrap;color:var(--muted)}
.pc{display:inline-block;min-width:24px;padding:0 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
.p-bl{background:var(--blue-bg);color:var(--blue-fg)}.p-gr{background:var(--green-bg);color:var(--green-fg)}.p-gy{background:var(--grey-bg);color:var(--grey-fg)}.p-or{background:var(--orange-bg);color:var(--orange-fg)}.p-pu{background:var(--purple-bg);color:var(--purple-fg)}
.prov{display:inline-block;font-size:10.5px;font-weight:700;color:var(--orange-fg);border:1px solid #f3b36b;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.tbd{display:inline-block;font-size:11px;font-weight:700;color:var(--red);border:1px solid #f7b4b4;background:#fff3f3;border-radius:4px;padding:0 5px;vertical-align:1px}
.thumb{width:150px;height:92px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#f1f3f7;overflow:hidden;position:relative}
.thumb .fo{position:absolute;left:50%;top:6px;width:330px;transform:translateX(-50%) scale(.4);transform-origin:top center;pointer-events:none}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:26px;text-align:center;color:var(--muted);font-size:13px}
.empty.sm{padding:16px}
.pager{display:flex;justify-content:center;gap:6px;padding:18px 0;border-bottom:1px solid var(--line)}
.pager button{width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer}
.pager button.on{background:var(--accent);color:#fff;font-weight:700}
/* detail */
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;font-size:13.5px}
.dh .bar{width:1px;height:14px;background:var(--line-strong)}
.dh .mono{color:var(--accent)}
.dh h1{font-size:20px;margin:0}
.dh .ds{font-size:12.5px;color:var(--muted)}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:18px 0 18px}
.sr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sl{font-size:13px;color:var(--sub)}.sl2{font-size:12.5px;color:var(--muted);margin-left:6px}
.sn{margin:8px 0 0;font-size:12.5px;color:var(--green-fg)}.sn.warn{color:var(--orange-fg)}
.dtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.dtab{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.dtab.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.dtab small{font-size:11px;margin-left:4px}
.box{border:1px solid var(--line);border-radius:12px;padding:24px 22px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh h3,.sh2 h3{margin:0;font-size:15.5px;border-left:3px solid var(--accent);padding-left:9px;line-height:1.2}
.sh2{display:flex;align-items:center;gap:8px;margin:0 0 14px}.sh2 .sub{font-size:12px;color:var(--faint)}
.ro{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:420px minmax(0,1fr);gap:22px;align-items:start}
.pvl{font-size:12px;color:var(--muted);margin-bottom:6px}
.pvw{background:#eceef3;border:1px solid var(--line);border-radius:6px;padding:26px 30px;min-height:420px;display:flex;justify-content:center;align-items:flex-start}
.pvw .fo{width:340px}
.kvs{border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--line)}
.kv .k{background:var(--surface-2);padding:12px 14px;font-size:13px;color:var(--sub);display:flex;align-items:center}
.kv .v{padding:10px 14px;font-size:13.5px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.kd{margin:4px 0 0;font-size:12px;color:var(--muted)}
.its{display:flex;flex-wrap:wrap;gap:6px}
.it{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:14px;padding:2px 10px;color:var(--faint)}
.it.on{border-color:#bfe5cd;background:#f2fbf5;color:var(--green-fg)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fst{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.fst i{font-style:normal;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:16px;height:16px;display:grid;place-items:center}
.far{color:var(--faint)}
.hr2{height:1px;background:var(--line);margin:26px 0}
table.ot{width:100%;border-collapse:collapse;font-size:13px}
.ot th{background:var(--surface-2);border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);padding:9px 8px;font-weight:600;color:var(--sub)}
.ot td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;color:var(--sub)}
.ot td.l{text-align:left}
.yes{font-size:12px;color:var(--green-fg)}
.cap{font-size:12px;color:var(--muted);margin:8px 0 0}.cap.top{margin:0 0 10px}
.refs{display:grid;gap:10px}
.ref{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ref .rfh{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.ref .acc{color:var(--accent)}
.ap{font-size:11.5px;border-radius:5px;padding:1px 7px;font-weight:600}
.ap.ok{background:var(--blue-bg);color:var(--blue-fg)}.ap.tmp{background:var(--grey-bg);color:var(--grey-fg)}.ap.no{background:#ffecec;color:#d23b3b}
.uy{font-size:12px;color:var(--muted)}
.rc{display:flex;gap:6px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--sub)}
.rchip b{color:var(--accent);font-weight:600}.rchip .pos{color:var(--muted)}.rchip .sep{color:var(--faint)}
.rchip:hover{border-color:var(--accent)}
.cchip{display:inline-flex;align-items:center;font-size:12px;border-radius:6px;padding:3px 8px;background:var(--purple-bg);color:var(--purple-fg)}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:#1f2230;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== FO 미리보기 ===== */
.fo{background:#fff;border-radius:22px;padding:22px 20px;font-size:13px;color:#1a1a1a;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fo.bs{border-radius:22px 22px 0 0}
.fo.nvw{background:#f6f7f9;border:1px dashed #c9ced8}
.fo-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.fo-h b{font-size:16px;font-weight:700;display:flex;align-items:center;gap:4px;line-height:1.35}
.fo-h p{margin:4px 0 0;color:#8a8f99;font-size:12.5px}
.fo-ti{width:14px;height:14px;color:#9aa0aa}
.fo-all{font-size:12px;color:#8a8f99;text-decoration:underline;white-space:nowrap}
.fo-ls{display:grid;gap:8px}
.fo-op{border:1px solid #e6e8ec;border-radius:14px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fafbfc}
.fo-op.on{border:1.5px solid #222;background:#fff}
.fo-op .fo-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.fo-op b{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fo-op small{font-size:11.5px;color:#8a8f99}
.fo-op strong{font-size:14px;font-weight:700}
.fo-op.sold b,.fo-op.sold strong{color:#9aa0aa}
.fo-sold{font-size:12px;color:#9aa0aa;align-self:flex-start}
.fo-op.none b{font-weight:600}
.fo-op.more{justify-content:flex-start;color:#555}
.fo-op.row .fo-r{display:flex;align-items:center;gap:6px;color:#999;font-size:11.5px}
.fo-lb{font-size:10px;font-weight:500;background:#eef0f4;color:#777;border-radius:4px;padding:0 5px}
.fo-op.card .fo-l{gap:3px}
.fo-lk{font-size:11.5px;color:#8a8f99;text-decoration:underline;margin-top:4px}
.fo-logo{width:40px;height:40px;border-radius:9px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.fo-bd{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;align-self:flex-start}
.bd-dk{background:#2b2d33;color:#fff}.bd-pu{background:#6c55f0;color:#fff}.bd-sk{background:#e8efff;color:#5b74e0}.bd-gy{background:#eef0f4;color:#777}
.fo-morebtn{background:#eff1ff;color:#5b67e0;border-radius:12px;text-align:center;padding:11px;font-size:13px;font-weight:600}
.fo-sm{font-size:12px;color:#666;margin:10px 0 6px}
.fo-sw{display:flex;gap:10px}
.fo-sw i{width:34px;height:34px;border-radius:50%;border:1px solid #ddd}
.fo-sw i.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #333}
.fo-gd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo-gi small{display:block;font-size:11px;color:#8a8f99;margin-top:8px}
.fo-gi b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
.fo-gimg{height:110px;background:#f0f1f4;border-radius:12px;display:grid;place-items:center;color:#b5bac4;position:relative}
.fo-rd{position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;border:1.5px solid #c5c9d1;background:#fff}
.fo-gb{display:block;border:1px solid #e1e3e8;border-radius:8px;text-align:center;font-size:11.5px;padding:5px;margin-top:8px}
.fo-hs{display:flex;gap:10px;overflow:hidden}
.fo-hi{flex:0 0 120px;display:flex;flex-direction:column;gap:2px}
.fo-hi .fo-gimg{height:96px;margin-bottom:6px}
.fo-hi b{font-size:12.5px;font-weight:600}.fo-hi strong{font-size:12.5px}.fo-hi small{font-size:11px;color:#8a8f99}
.fo-ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fo-ch span{border:1px solid #e1e3e8;border-radius:12px;text-align:center;padding:11px;font-size:13px;background:#fafbfc}
.fo-ch span.on{border:1.5px solid #222;background:#fff;font-weight:600}
.fo-ch span.pri{background:#5b55e8;color:#fff;border-color:#5b55e8;font-weight:600}
.fo-in{border:1px solid #e1e3e8;border-radius:12px;padding:11px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.fo-in.ph{color:#b5bac4;background:#f6f7f9}
.fo-in em{font-style:normal;font-size:11px;background:#eef0f4;color:#666;border-radius:10px;padding:2px 8px}
.fo-ck{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#666;margin:12px 0 0}
.fo-ck svg{color:#b5bac4;border:1px solid #d5d8de;border-radius:50%;padding:2px;width:16px;height:16px}
.fo-ck.all{margin:0 0 10px}.fo-ck.all i{width:16px;height:16px;border:1.5px solid #c5c9d1;border-radius:50%}
.fo-rl{display:grid;gap:12px}
.fo-ri{display:flex;align-items:center;gap:8px;font-size:13.5px}
.fo-ri i{width:18px;height:18px;border-radius:50%;border:1.5px solid #c5c9d1}
.fo-ri i.on{border:5px solid #5b55e8}
.fo-rd2{margin:-6px 0 0 26px;font-size:11.5px;color:#8a8f99;background:#f4f5f8;border-radius:8px;padding:6px 10px}
.fo-sum{display:grid;gap:8px}
.fo-sp{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;border:1px solid #e6e8ec;border-radius:12px;padding:10px 12px;margin-bottom:4px}
.fo-sp i{width:30px;height:38px;border-radius:5px;background:#6d4c4c}
.fo-sp b{font-weight:500}
.fo-sr{display:flex;justify-content:space-between;font-size:12.5px;color:#555}
.fo-sr em{font-style:normal;color:#1a1a1a}
.fo-sr.tot{border-top:1px solid #eee;padding-top:10px;font-weight:700}
.fo-sr.tot em{color:#5b55e8}
.fo-x{color:#555}
.fo-tl{display:flex;align-items:center;gap:8px;margin:0;padding:6px 0;font-size:12.5px;color:#555}
.fo-tl span{flex:1}.fo-tl svg{color:#b5bac4}
.fo-btn{width:100%;border:1px solid #e1e3e8;background:#fff;border-radius:12px;padding:10px;font-size:12.5px;margin-top:12px;cursor:default}
.fo-btn.pri{background:#5b55e8;border-color:#5b55e8;color:#fff;font-weight:600}
.fo-ai{background:linear-gradient(160deg,#f3f2ff,#eef1fb);border-radius:16px;padding:16px}
.fo-ait{color:#5b55e8;font-size:13px}
.fo-ai p{font-size:12px;color:#777;margin:6px 0 10px}
.fo-kv{display:grid;gap:8px}
.fo-kv div{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.fo-kv span{color:#999;flex:none}.fo-kv em{font-style:normal;color:#555;text-align:right}

.btn-pri:disabled{background:#b9aef3;cursor:default}

/* v7 */
.cvt{display:inline-block;font-size:10.5px;font-weight:700;color:var(--grey-fg);background:var(--grey-bg);border-radius:4px;padding:0 5px;margin-right:6px}
.inp.cvin:disabled{background:var(--surface-2);color:var(--faint);border-style:dashed}
.orow.ct{grid-template-columns:22px 30px 220px minmax(0,1fr) 150px 30px}
.orow.ct.ro{grid-template-columns:30px 220px minmax(0,1fr) 150px}
.orow.ep.ro{grid-template-columns:30px 240px minmax(0,1fr)}
.orhd{display:grid;grid-template-columns:30px 220px minmax(0,1fr) 150px;gap:6px;padding:0 12px 6px;font-size:11.5px;color:var(--muted)}
.orhd.ed{grid-template-columns:22px 30px 220px minmax(0,1fr) 150px 30px;padding:0 8px 6px}
.orhd.ed span:first-child{grid-column:span 2}
.ctrs{display:grid;gap:8px;width:100%}
.ctr{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.ck{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ctvs{display:grid;gap:6px;width:100%}
.ctv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px}
.ctv .lk2{color:var(--muted);font-size:12.5px}
.ctv .on{font-size:12px;color:var(--green-fg)}.ctv .off{font-size:12px;color:var(--faint)}

.ctg{display:grid;gap:10px;width:100%}
.ctb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:#fff}
.ctbh{font-size:12.5px;font-weight:700;color:var(--sub)}
.ctl{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.ctl .lb{font-size:12.5px;color:var(--muted)}

table.ctt{width:100%;border-collapse:collapse;border:1px solid var(--line);font-size:13px}
.ctt th,.ctt td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:middle}
.ctt th{background:var(--surface-2);font-weight:600;color:var(--text);width:170px;white-space:nowrap}
.ctt td.cts{width:170px;background:#fff;text-align:center}
.ctt .req{color:var(--red);font-style:normal;font-size:10px;vertical-align:6px;margin-left:2px}
.ss.ctsel{width:140px;margin:0 auto}
.orow.ct.ni{grid-template-columns:22px 30px minmax(0,1fr) 150px 30px}
.orow.ct.ni.ro{grid-template-columns:30px minmax(0,1fr) 150px}
.orhd.ni{grid-template-columns:30px minmax(0,1fr) 150px}
.orhd.ed.ni{grid-template-columns:22px 30px minmax(0,1fr) 150px 30px}

.kv .v.ctav{padding:0;display:block}
table.ctt{border:0;width:100%}
.ctt tr+tr th,.ctt tr+tr td{border-top:1px solid var(--line)}
.ctt th,.ctt td{border:0;padding:10px 14px}
.ctt th{width:150px;background:var(--surface-2);border-right:1px solid var(--line)!important;font-weight:500;color:var(--sub)}
.ss.ctsel{width:140px;margin:0}
.orow.ep.ni{grid-template-columns:22px 30px minmax(0,1fr) 30px}
.orow.ep.ni.ro{grid-template-columns:30px minmax(0,1fr)}

/* 상세 : 코너 등록(src/order-corner-create-v22.css)과 같은 미리보기 프레임 · 아코디언 · 표 형태 행 · 하단 고정 버튼 */
#pDetail .rcol{gap:0}
#pDetail .kvs{border-top:1px solid #cfd4dc}
#pDetail .kv{grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--cc-line);min-height:52px}
#pDetail .kv .k{padding:10px 14px;background:var(--cc-th);border-right:0;font-size:13px;font-weight:400;color:#30343c;line-height:1.4}
#pDetail .kv .v{padding:9px 14px;font-size:13px}
#pDetail .kv .v.ctav{padding:0}
#pDetail .inp{border-color:#d5d9e0}
#pDetail .inp:focus{outline:none;border-color:var(--cc-ac)}
#pDetail #tUse,#pDetail #tHist,#pDetail #tInfo{margin-bottom:28px}
#dPv .fo{width:100%;padding:0;border-radius:0;box-shadow:none}
#dPv .grpv{display:grid;gap:16px}
#dPv .gl{margin:0 0 6px;font-size:11px;color:var(--muted)}
#pDetail .dfoot.cc-foot{justify-content:space-between;margin:auto calc(var(--sh-px)*-1) calc(var(--sh-pb)*-1)}   /* 위쪽 .dfoot 여백 규칙보다 우선 */
#pDetail .cc-foot .btn-list,#pDetail .cc-foot .btn-pri{height:40px;min-width:64px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:600}
#pDetail .cc-foot .btn-list{border:1px solid #cfd4dc}
/* 조회 영역 : 사용 여부 | 검색어를 한 줄에 두고 조회 · 초기화 버튼은 맨 끝 (프로모션 목록 조회 영역과 같은 구성) */
body.ul #srch{flex-wrap:nowrap}
body.ul #srch .sg+.sg::before{height:22px;margin:0 20px}
body.ul #srch .sgl{margin-right:12px;font-weight:600}
body.ul #srch .rds{gap:18px}body.ul #srch .rds label{gap:6px}
body.ul #srch .sa .sbtn{min-width:76px;border-radius:6px;font-weight:500}
@media (max-width:1100px){body.ul #srch{flex-wrap:wrap}}
/* 공통 LNB(src/lnb.ts) 적용: 바깥 여백은 .app.with-lnb가 주므로 목업 .main 여백을 덜어냅니다 */
.app.with-lnb .main{padding:0}
.app.with-lnb .sheet{min-height:calc(100vh - 28px)}
/* 로그인 화면(src/auth.ts): 로그인 전에는 본문을 숨기고 가운데 카드로 보여 준다 */
body:not(.authenticated) .app{display:none}
.auth-gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:#eaecf5}
.auth-card{width:min(100%,380px);padding:32px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px #29345918}
.auth-card h1{margin:0 0 8px;font-size:22px}
.auth-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
.auth-form{display:grid;gap:12px}
.auth-form label{font-size:12px;color:#4f5e77;font-weight:500}
.auth-form input{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff}
.auth-form .btn{min-height:42px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.auth-error{min-height:20px;margin:0;color:#c0392b;font-size:12px}
</style>
</head>
<body class="ul">
<!-- 이 페이지의 화면 구성은 아래 HTML에서 직접 수정하세요. 코너 데이터 · 미리보기 · 목록/상세/수정 로직은 src/order-corner-v22.ts -->
<div class="app">
  <nav class="app-nav" aria-label="주 메뉴" data-auto-collapse="1440"></nav>
  <main class="main"><div class="sheet">
    <div class="crumb2" id="crumb"></div>

    <!-- ===== 목록 ===== -->
    <section id="pList">
      <div class="ph"><h1>코너 유형 관리</h1></div>
      <div class="srch" id="srch">
        <div class="sg"><span class="sgl">사용 여부</span><div class="rds"><label><input type="radio" name="fuse" value="" checked>전체</label><label><input type="radio" name="fuse" value="Y">Y</label><label><input type="radio" name="fuse" value="N">N</label></div></div>
        <div class="sg kw"><span class="sgl">검색어</span><div class="ss w120"><select id="fKey"><option value="n">코너명</option><option value="i">코너 ID</option></select><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div><div class="si"><input id="fKw" type="text" placeholder="검색어를 입력하세요" autocomplete="off"><button type="button" id="bClr" aria-label="입력값 삭제" hidden><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
        <div class="sa"><button type="button" class="sbtn" id="bReset">초기화</button><button type="button" class="sbtn pri" id="bSearch">조회</button></div>
      </div>
      <div class="rh"><h2>조회 결과<small>총 <b id="rCnt">0</b>건</small></h2></div>
      <div id="vList">
        <table class="lt" id="lTable"><colgroup><col style="width:120px"><col><col style="width:96px"><col style="width:120px"><col style="width:120px"><col style="width:64px"><col style="width:70px"><col style="width:110px"><col style="width:140px"></colgroup>
          <thead><tr><th>코너 ID</th><th>코너명</th><th>코너 유형</th><th>코너 형태</th><th>표시 방식</th><th>버전</th><th>사용여부</th><th>최근 수정일</th><th>최근 수정자</th></tr></thead><tbody id="lBody"></tbody></table>
      </div>
      <div class="empty" id="lEmpty" hidden style="margin-top:8px">조회된 코너가 없습니다.</div>
      <!-- 목록 아래 : 가운데 페이지 번호 + 오른쪽 등록 버튼 (list-unified .lst-bottom) -->
      <div class="lst-bottom"><div class="pager" id="pager"></div><div class="lst-foot"><button type="button" class="btn pri" id="bCreate">코너 등록</button></div></div>
    </section>

    <!-- ===== 등록 : 화면은 src/order-corner-create-v22.ts가 그린다 ===== -->
    <section id="pCreate" hidden>
      <div class="ph"><h1>주문 코너 등록</h1></div>
      <div class="cc-grid">
        <aside class="cc-left"><section class="cc-pv" aria-label="미리보기"><div class="cc-pvbox"><div class="cc-phone" id="ccPv"></div></div></section><button type="button" class="cc-reset" data-cc="reset">설정 값 초기화하기</button></aside>
        <div class="cc-right" id="ccForm"></div>
      </div>
      <div class="cc-foot"><button type="button" class="cc-btn" data-cc="cancel">취소</button><button type="button" class="cc-btn pri" data-cc="save">저장</button></div>
    </section>

    <!-- ===== 상세 / 수정 ===== -->
    <section id="pDetail" hidden>
      <div class="ph"><div class="dh2"><h1 id="dName"></h1><span class="mono did" id="dId"></span><span id="dPills"></span></div><button type="button" class="btn-sm" id="bTopList">목록 보기</button></div>
      <div class="dtabs" id="dTabs"><button type="button" class="dtab on" data-dt="info">상세 정보</button><button type="button" class="dtab" data-dt="use">사용 위치<small id="uCnt"></small></button><button type="button" class="dtab" data-dt="hist">변경/승인 이력<small id="hCnt"></small></button></div>

      <div id="tInfo">
        <div class="cc-grid">
          <aside class="cc-left"><section class="cc-pv" aria-label="미리보기"><div class="cc-pvbox"><div class="cc-phone" id="dPv"></div></div></section></aside>
          <div class="rcol" id="dRight"></div>
        </div>

      <!-- 사용 위치 · 변경/승인 이력 : 카드 없이 회색 머리줄 표 + 가운데 페이지 번호 (설문 상세 변경/승인 이력 화면 기준) -->
      <div id="tUse" hidden>
        <div class="dh-tw"><table class="dh-t"><colgroup><col style="width:70px"><col style="width:150px"><col style="width:120px"><col><col style="width:130px"><col style="width:100px"></colgroup>
          <thead><tr><th>No.</th><th>프로세스 ID</th><th>구분</th><th class="l">프로세스명</th><th>승인 상태</th><th>사용 여부</th></tr></thead><tbody id="uBody"></tbody></table></div>
        <div class="dh-pg" id="uPg"></div>
      </div>

      <div id="tHist" hidden>
        <div class="dh-tw"><table class="dh-t"><colgroup><col style="width:60px"><col style="width:96px"><col style="width:64px"><col style="width:150px"><col style="width:170px"><col><col style="width:150px"><col style="width:170px"><col><col style="width:96px"></colgroup>

    </section>
  </div></main>
</div>
<div class="mdim" id="epcDim" hidden>
  <div class="mdl" role="dialog" aria-modal="true" aria-labelledby="epcT">
    <div class="mdl-h"><h2 id="epcT">EPC 상품 조회</h2><span id="epcSub">LV1 · 상품 (고정)</span><button type="button" class="mdl-x" id="epcX" aria-label="닫기">✕</button></div>

      <div class="mrow"><label>검색어</label><input class="inp" id="eKw" placeholder="상품명, EPC 상품ID, 상품 코드 또는 Product Spec 입력"><span class="msp"></span><button type="button" class="sbtn" id="eReset">초기화</button><button type="button" class="sbtn pri" id="eSearch">조회</button></div>
    </div>
    <div class="mdl-r"><b>검색 결과</b><em id="eCnt">0</em><span>건</span></div>
    <div class="mdl-t"><table class="et"><thead><tr id="eHead"></tr></thead><tbody id="eBody"></tbody></table></div>
    <div class="mdl-f"><button type="button" class="btn-list" id="eCancel">취소</button><button type="button" class="btn-pri" id="eAdd" disabled>추가하기</button></div>
  </div>
</div>
