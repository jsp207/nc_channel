  <body>
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
<main>

<!-- 이 페이지의 화면 구성은 아래 HTML에서 직접 수정하세요. -->
<section class="view on" id="v-display-create">
  <div class="breadcrumb" aria-label="현재 위치">홈 <span aria-hidden="true">›</span> 상품 운영 관리 <span aria-hidden="true">›</span> <strong>전시 생성하기</strong></div>
  <div class="toolbar"><h1>전시 생성하기</h1><a class="btn" href="display-list.html" style="margin-left:auto">전시 목록 보기</a></div>
  <p class="sub">전시할 번들을 선택하고 채널, 위치, 기간을 설정하세요.</p>
  <div class="builder">
    <div>
      <div class="step"><header><span class="n">1</span><b>무엇을</b></header><div class="body"><div class="row"><label>번들</label><select id="dObj"></select></div><div id="dObjInfo" style="color:var(--muted);font-size:13px"></div></div></div>
      <div class="step"><header><span class="n">2</span><b>어디에, 언제</b></header><div class="body">
        <div class="row"><label>채널</label><select id="dCh"><option>T다이렉트샵</option><option>T월드</option><option>T우주</option></select><label>위치</label><select id="dSection"><option>기획전</option><option>메인 배너</option><option>추천</option></select><label>순서</label><input type="text" id="dOrder" value="1" style="width:56px"></div>
        <div class="row"><label>전시명</label><input type="text" id="dTitle" placeholder="비우면 번들명" style="flex:1;min-width:200px"></div>
        <div class="row"><label>기간</label><input type="text" id="dFrom" value="2026-10-01" style="width:120px"> ~ <input type="text" id="dTo" placeholder="비우면 상시" style="width:120px"></div>
      </div></div>
    </div>
    <aside class="panel">
      <header><b>고객 화면 미리보기</b></header>
      <div class="summary" id="dPreview"></div>
      <ul class="rules" id="dRules"></ul>
      <footer><button class="btn primary" id="dSave">전시 저장</button></footer>
    </aside>
  </div>
</section>

</main>
</div>
<div class="toast" id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
