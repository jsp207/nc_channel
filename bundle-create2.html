<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaecf5" />
    <title>번들 생성 | NC-Channel Product Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body data-variant-selection="manual">
<div class="type-switch" role="group" aria-label="번들 생성 타입 전환"><span>TYPE</span><a href="bundle-create.html">번들생성</a><a href="bundle-create2.html" class="on" aria-current="page">번들생성 2</a><a href="bundle-create3.html">번들생성 3</a><a href="bundle-create4.html">번들생성 4</a></div>
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
<main>

<!-- 이 페이지의 화면 구성은 아래 HTML에서 직접 수정하세요. -->
<section class="view on" id="v-bundles">
  <div class="breadcrumb" aria-label="현재 위치">홈 <span aria-hidden="true">›</span> 상품 운영 관리 <span aria-hidden="true">›</span> <strong>번들 생성</strong></div>
  <div class="toolbar"><h1>번들 생성</h1><a class="btn" href="bundle-list.html" style="margin-left:auto">번들 목록 보기</a></div>
  <div class="builder">
    <div>
      <div class="step">
        <header><span class="n">1</span><b>대표 상품</b></header>
        <div class="body">
          <div class="row"><label for="bArea">유형</label><select id="bArea"></select><label>단품</label><select id="bHead"></select></div>
          <div id="bHeadInfo" style="color:var(--muted);font-size:13px"></div>
          <div class="variant-picker">
            <input id="bVariantSearch" type="search" placeholder="상품명, 용량, 색상 검색" aria-label="상품명, 용량, 색상 검색" aria-controls="bVariants">
            <div id="bVariants" class="variant-list" role="group" aria-label="대표 상품 변형 목록">
              <label class="variant-row" id="bVariantAllRow"><input id="bVariantAll" type="checkbox"><span id="bVariantAllLabel">전체 선택</span></label>
            </div>
          </div>
        </div>
      </div>
      <div id="slots"></div>
      <button class="btn" id="addSlot">+ 추가 상품</button>
    </div>
    <aside class="panel">
      <header><b>검사 결과</b><span class="po" id="poCount">1<small>PO</small></span></header>
      <div class="summary" id="bSummary"></div>
      <ul class="rules" id="ruleList"></ul>
      <footer><button class="btn" id="bReset">초기화</button><button class="btn primary" id="bSave" disabled>번들 저장</button></footer>
    </aside>
  </div>
</section>

</main>
</div>
<div class="toast" id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
