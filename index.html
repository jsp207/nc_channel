<!doctype html>
<html lang="ko">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J45JDGG545"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J45JDGG545');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaecf5" />
    <title>히스토리 | NC-Channel Product Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* 히스토리 탭: 상품 / 주문 / 결제 */
      .h-tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
      .h-tabs button{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
      .h-tabs button:hover{color:var(--text)}
      .h-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
      .h-cnt{min-width:20px;padding:0 6px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:11px;line-height:18px;text-align:center}
      .h-tabs button[aria-selected="true"] .h-cnt{background:var(--accent-soft);color:var(--accent)}
      [role="tabpanel"][hidden]{display:none}
      /* 메뉴 구분 버튼 */
      .h-seg{margin:0 0 12px;flex-wrap:wrap}
      .h-seg button{display:inline-flex;align-items:center;gap:6px}
      .h-seg button.on .h-cnt{background:rgba(255,255,255,.2);color:#fff}
      .h-tag{font-size:10px;padding:0 5px;border:1px solid currentColor;border-radius:4px;opacity:.6}
      /* 표 */
      .h-latest{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
      .h-ver{font-variant-numeric:tabular-nums;font-weight:600}
      .h-file{color:var(--muted);font-size:12px}
      .h-note{color:var(--muted);font-size:12px}
      .h-none{color:var(--muted)}
      .h-empty{padding:28px;text-align:center;color:var(--muted)}
      tr.h-vstart:not(:first-child) td{border-top:2px solid var(--line)}
    </style>
  </head>
  <body>
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
<main>

<!-- 작업한 화면 파일 목록입니다. 상품·주문·결제 탭으로 나눠 둡니다. -->
<section class="view on" id="v-history">
  <div class="breadcrumb" aria-label="현재 위치">홈 <span aria-hidden="true">›</span> <strong>히스토리</strong></div>
  <h1>히스토리</h1>
  <p class="sub">메뉴 › 버전 › 화면 순으로 정리했습니다. <b>Latest</b>는 왼쪽 메뉴에 연결된 버전입니다.</p>
  <!-- 목록은 src/history-data.ts에서 그립니다. 새 화면은 그 파일 SCREENS에 한 줄 추가하세요 -->
  <div class="h-tabs" role="tablist" aria-label="히스토리 구분"></div>
  <div id="historyPanels"></div>
</section>

</main>
</div>
    <script type="module" src="/src/history.ts"></script>
  </body>
</html>
