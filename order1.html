<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebeef6" />
    <title>주문 템플릿 관리 | NC-Channel Product Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- 주문 템플릿 관리 · 조회 (ref/template-register-3pane-start-mockup-v20.html). 스타일은 src/order1.css -->
  </head>
  <body>
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
  <main class="main">
    <!-- ===== 조회 (주문 템플릿 관리) · 등록/상세는 order1-create.html ===== -->
    <div class="sheet" id="scrList">
      <div class="crumb">홈 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg> 주문 관리 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg> <span class="cur">주문 템플릿 관리</span></div>
      <h1>주문 템플릿 관리</h1>
      <div class="hr"></div>
      <div class="lfilter">
        <div class="lf-row">
          <div class="lf-i"><span class="lt">사용 여부</span><div class="rad"><label><input type="radio" name="luse" value="" checked>전체</label><label><input type="radio" name="luse" value="Y">Y</label><label><input type="radio" name="luse" value="N">N</label></div></div>
          <div class="lf-i"><span class="lt">승인 상태</span><div class="chk"><label><input type="checkbox" id="lAp0" checked>전체</label><label><input type="checkbox" id="lAp1" checked>임시 저장</label><label><input type="checkbox" id="lAp2" checked>승인 대기</label><label><input type="checkbox" id="lAp3" checked>승인 완료</label><label><input type="checkbox" id="lAp4" checked>반려</label><label><input type="checkbox" id="lAp5" checked>요청 취소</label></div></div>
        </div>
        <div class="lf-row">
          <div class="lf-i"><span class="lt">카테고리</span><div class="sel" style="width:190px"><select id="lCat"><option value="">전체</option><option>상품 유형 템플릿</option><option>전시 상품 템플릿</option></select></div></div>
          <div class="lf-i"><span class="lt">템플릿 ID</span><input type="text" id="lId" placeholder="최대 30자까지 입력 가능" maxlength="30" autocomplete="off"></div>
          <div class="lf-i"><span class="lt">템플릿명</span><input type="text" id="lNm" placeholder="최대 30자까지 입력 가능" maxlength="30" autocomplete="off"></div>
          <div class="lf-i"><span class="lt">등록 기간</span><input type="date" id="lFrom" value="2026-09-01"><span>-</span><input type="date" id="lTo" value="2026-10-31"></div>
          <div class="lf-act"><button class="btn line" id="lReset" type="button">초기화</button><button class="btn primary" id="lBtn" type="button">조회</button></div>
        </div>
      </div>
      <div class="rhead"><h2>조회 결과</h2><span class="c"><b id="lCnt">0</b>건</span></div>
      <div class="tbl ltbl"><table>
        <thead><tr><th style="width:56px">No.</th><th>카테고리</th><th>템플릿 ID</th><th class="l">템플릿명</th><th>연동 상품 수</th><th>승인 상태</th><th>사용 여부</th><th>템플릿 복사</th><th>최종 등록(수정)일자</th><th>최종 등록(수정)자</th></tr></thead>
        <tbody id="lBody"></tbody></table>
        <div class="emptyrow" id="lEmpty" hidden>조회된 템플릿이 없습니다.</div>
      </div>
      <div class="lpg"><div id="lPager"></div><div class="lfoot"><a class="btn primary" id="lReg" href="order1-create.html">등록</a></div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
    <script type="module" src="/src/order1.ts"></script>
  </body>
</html>
