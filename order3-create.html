e cx="25.18" cy="10.70" r="1.20"/><circle cx="26.24" cy="13.26" r="1.20"/><circle cx="29.00" cy="16.00" r="1.30"/><circle cx="28.72" cy="18.70" r="1.30"/><circle cx="27.88" cy="21.29" r="1.30"/><circle cx="26.52" cy="23.64" r="1.30"/><circle cx="24.70" cy="25.66" r="1.30"/><circle cx="22.50" cy="27.26" r="1.30"/><circle cx="20.02" cy="28.36" r="1.30"/><circle cx="17.36" cy="28.93" r="1.30"/><circle cx="14.64" cy="28.93" r="1.30"/><circle cx="11.98" cy="28.36" r="1.30"/><circle cx="9.50" cy="27.26" r="1.30"/><circle cx="7.30" cy="25.66" r="1.30"/><circle cx="5.48" cy="23.64" r="1.30"/><circle cx="4.12" cy="21.29" r="1.30"/><circle cx="3.28" cy="18.70" r="1.30"/><circle cx="3.00" cy="16.00" r="1.30"/><circle cx="3.28" cy="13.30" r="1.30"/><circle cx="4.12" cy="10.71" r="1.30"/><circle cx="5.48" cy="8.36" r="1.30"/><circle cx="7.30" cy="6.34" r="1.30"/><circle cx="9.50" cy="4.74" r="1.30"/><circle cx="11.98" cy="3.64" r="1.30"/><circle cx="14.64" cy="3.07" r="1.30"/><circle cx="17.36" cy="3.07" r="1.30"/><circle cx="20.02" cy="3.64" r="1.30"/><circle cx="22.50" cy="4.74" r="1.30"/><circle cx="24.70" cy="6.34" r="1.30"/><circle cx="26.52" cy="8.36" r="1.30"/><circle cx="27.88" cy="10.71" r="1.30"/><circle cx="28.72" cy="13.30" r="1.30"/></g></svg></a>
  <div class="rail-actions">
    <button class="rail-btn" type="button" aria-label="계정" title="계정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg></button>
    <button class="rail-btn" type="button" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    <button class="rail-btn on" type="button" aria-label="라이트 테마" aria-pressed="true" title="라이트 테마"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" class="fill"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
  </div>
</nav>

  <main class="main">
    <div class="ws" id="ws">

      <section id="view-detail">
        <nav class="crumb" aria-label="현재 위치"><span>홈</span><span>주문 관리</span><span><a href="index.html#order" class="crumb-link" id="crumb-list">주문 프로세스 관리</a></span><span><b id="d-crumb">프로세스 상세</b></span></nav>
        <div class="phead">
          <h1><span id="d-title">프로세스 상세</span><span class="badge" id="d-status" hidden></span></h1>
          <div class="acts" id="d-acts"></div>
        </div>
        <div class="ws-scroll" id="d-scroll">
          <div class="alert" id="d-alert" hidden></div>
          <!-- 상품 전시 관리 v0.2.1과 같은 구성: 왼쪽 고정 미리보기 + 오른쪽 접히는 섹션 + 하단 고정 바 -->
          <div class="builder">
            <aside class="side">
              <section class="pv-panel" aria-label="미리보기">
                <header><b>미리보기</b><span class="pv-stage" id="pv-stage"></span></header>
                <div class="pvbox"><div class="pv"><div class="phone"><div class="pfix" id="phd"><div class="pfz"><div class="phd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 5-7 7 7 7" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="flex:1"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 8.5h13l-1 11.5h-11l-1-11.5Z" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" stroke="#111" stroke-width="1.8"/></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg></div><div class="pprog" id="pprog" role="progressbar" aria-label="주문 진행 단계"></div></div></div><div class="pscroll" id="pscroll"><div class="sg" id="sg"></div></div><div class="pfix" id="pft"><div class="pfz"><div class="pft"><div class="pft-ai"><span>✦</span>주혁님 또래는 그라파이트 색상을 더 선호해요</div><div class="pft-row"><span class="pft-t"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 4h12v3.2h-4.3V18H7.3V7.2H3V4Z" fill="#3d3af0"/><path d="M17 12.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z" fill="#3d3af0"/></svg></span><span class="pft-cta">옵션 선택하기</span></div></div></div></div></div></div></div>
              </section>
            </aside>
            <div class="steps">
              <div class="step" id="sec-basic">
                <header><b>기본 정보</b><span class="rq">필수</span><span class="st"><span class="stc" id="st-basic"></span></span><button type="button" class="fold" aria-expanded="true" aria-controls="basic" aria-label="접기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></header>
                <div class="body">
                  <div class="frm" id="basic">
                    <div class="fr"><label class="fl req" for="b-cat">전시 상품유형</label><div class="fv"><select class="ctl" id="b-cat" aria-label="전시 상품유형"><option value="">선택하세요</option><option>상품 유형 프로세스</option><option>세부유형 프로세스</option><option>특정 전시 상품 프로세스</option></select><span class="help err" id="e-cat" hidden>전시 상품유형를 선택하세요.</span></div></div>
                    <div class="fr"><label class="fl req" for="b-ptype">연결 대상 상품 유형</label><div class="fv"><select class="ctl" id="b-ptype" aria-label="연결 대상 상품 유형"><option value="">선택하세요</option></select><span class="help err" id="e-ptype" hidden>연결 대상 상품 유형을 선택하세요.</span></div></div>
                    <div class="fr"><label class="fl req" for="b-id">프로세스 ID</label><div class="fv"><input class="ctl" id="b-id" readonly disabled aria-label="프로세스 ID"></div></div>
                    <div class="fr"><label class="fl req" for="b-name">프로세스명</label><div class="fv"><span class="clr"><input class="ctl" id="b-name" placeholder="프로세스명을 입력하세요." maxlength="60"><button type="button" class="clr-x" data-clr="b-name" aria-label="지우기" hidden></button></span><span class="help err" id="e-name" hidden>프로세스명을 입력하세요.</span></div></div>
                    <div class="fr full"><label class="fl" for="b-desc">설명</label><div class="fv"><span class="clr"><input class="ctl" id="b-desc" placeholder="어떤 상품에 적합한 프로세스 구성인지 입력하세요." maxlength="200"><button type="button" class="clr-x" data-clr="b-desc" aria-label="지우기" hidden></button></span></div></div>
                    <div class="fr full"><span class="fl req">사용 여부</span><div class="fv"><div class="opts-row" id="b-use" role="radiogroup" aria-label="사용 여부"><label class="rd" for="b-use-y"><input type="radio" name="b-use" id="b-use-y" value="Y"><span>Y</span></label><label class="rd" for="b-use-n"><input type="radio" name="b-use" id="b-use-n" value="N"><span>N</span></label></div></div></div>
                  </div>
                </div>
              </div>
              <!-- 템플릿·코너 설정 (주문화면 B안): 템플릿 1~N = 주문 단계 영역, 각 영역 안에서 코너 추가·삭제 -->
              <div class="tpl-sec" id="sec-tpl">
                <div class="tpl-head"><b>템플릿·코너 설정</b><span class="tpl-tools" id="tpl-tools"><button type="button" class="btn outline sm" id="btn-foldall">모두 접기</button><button type="button" class="btn ghost sm" id="btn-tab">복제하기</button></span></div>
                <div class="cfg-empty" id="cfg-empty" hidden><span class="ce-ic" aria-hidden="true">+</span><b>아직 구성된 템플릿이 없습니다.</b><span class="ce-t">새로 만들거나, 기존 프로세스를 복제해서 시작하세요.</span><div class="ce-acts"><button type="button" class="btn outline" id="ce-new">새로 만들기</button><button type="button" class="btn filled" id="ce-copy">복제하기</button></div></div>
                <div class="cfg-body" id="cfg-body">
                  <div class="acc-list" id="acc"></div>
                  <button class="tpl-add" type="button" id="btn-tadd">+ 템플릿 추가</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 하단 고정 영역: 구성 검증 시트 + 요약/버튼 바 (상품 전시 관리와 같은 dock 구조) -->
        <div class="dock-dim" id="vf-dim" hidden></div>
        <div class="dock" id="dock">
          <section class="dock-sheet" id="vf-sheet" aria-labelledby="vf-ttl" hidden>
            <div class="vf-h"><i class="dock-handle" aria-hidden="true"></i><b id="vf-ttl">구성 검증</b><span class="stc" id="st-vf"></span><span class="vf-at" id="vf-at"></span><button type="button" class="btn grey sm" id="vf-rerun">다시 검증</button><button type="button" class="x" id="vf-close" aria-label="닫기">✕</button></div>
            <div class="vf-body" id="vf"></div>
          </section>
          <div class="sticky-acts" id="d-foot"></div>
        </div>
      </section>

    </div>
  </main>
</div>

<div id="dlg-root"></div>
<div id="toast-root"></div>

<script type="module" src="/src/order3-create.ts"></script>
</body>
</html>
