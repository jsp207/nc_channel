<!doctype html>
<html lang="ko">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J45JDGG545"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J45JDGG545');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaecf5" />
    <title>EPC 상품 조회 | NC-Channel Product Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="ul">
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
<main>

<!-- EPC 상품 조회 목록. 스크립트는 src/epc-list.ts, 스타일은 src/epc-list.css(목록 공통은 src/list.css) -->
<section class="view on" id="v-list">
  <div class="breadcrumb" aria-label="현재 위치">홈 <span aria-hidden="true">›</span> 상품 관리 <span aria-hidden="true">›</span> <strong>EPC 상품 조회</strong></div>
  <h1 class="lst-title">EPC 상품 조회</h1>

  <!-- 조회 조건: [조회]를 눌러야 결과에 반영된다. 버튼은 마지막 줄 오른쪽 -->
  <form class="lst-filter" id="lFilter" autocomplete="off">
    <div class="lf-row">
      <span class="lf-g">
        <label class="lf-l" for="fKey">조회 조건</label>
        <select id="fKey"><option value="all">전체</option><option value="name">EPC 상품명</option><option value="epc">EPC 상품ID</option><option value="spec">Product Spec</option></select>
        <input type="text" id="fQ" placeholder="EPC 상품명, EPC 상품ID 또는 Product Spec 입력" aria-label="검색어">
      </span>
      <span class="lf-g"><label class="lf-l" for="fLv2">LV2</label><select id="fLv2"></select></span>
    </div>
    <div class="lf-row">
      <span class="lf-g"><label class="lf-l" for="fLv3">LV3</label><select id="fLv3"></select></span>
      <span class="lf-g"><label class="lf-l" for="fSt">EPC 상태</label><select id="fSt"></select></span>
      <span class="lf-acts"><button type="reset" class="btn dark">초기화</button><button type="submit" class="btn primary">조회</button></span>
    </div>
  </form>
  <h2 class="lst-count">조회 결과 <span>총 <b id="lCount">0</b>건</span></h2>

  <div class="lst-tw"><table class="lst-table" id="listTable">
    <colgroup><col class="w-id"><col class="w-ver"><col><col class="w-lv2"><col class="w-lv3"><col class="w-spec"><col class="w-st"><col class="w-at"></colgroup>
    <thead><tr>
      <th>EPC 상품ID</th>
      <th class="c">버전</th>
      <th>EPC 상품명</th>
      <th>LV2</th>
      <th>LV3</th>
      <th>Product Spec</th>
      <th class="c">EPC 상태</th>
      <th class="c">최종등록일시</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <!-- 페이지 번호(가운데) + 다운로드(오른쪽)를 한 줄에. 다운로드는 조회 결과 전체를 JSON으로 -->
  <div class="lst-bottom">
  <nav class="lst-pager" id="pager" aria-label="페이지"></nav>
  <div class="lst-foot">
    <button class="btn primary lg" type="button" id="btnDown">다운로드</button>
  </div>
  </div>
</section>

</main>
</div>
    <script type="module" src="/src/epc-list.ts"></script>
  </body>
</html>
