<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 전시 어드민 프로토타입 v3</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f7f9; --surface2:#eef0f4; --line:#e3e6eb; --line2:#cfd4dc;
  --text:#1d2330; --muted:#6b7385; --faint:#9aa1b0;
  --accent:#4a3fd1; --accent-soft:#eeecfd; --accent-line:#b9b3f3;
  --ok:#1f7a4d; --ok-soft:#e5f5ec; --warn:#9a5b00; --warn-soft:#fff4dc; --bad:#b4232c; --bad-soft:#fde8ea;
  --info:#1f5fa8; --info-soft:#e7f0fb; --r:8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;font-size:14px;color:var(--text);background:var(--surface);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--bg);border-radius:var(--r);padding:0 12px;height:34px}
button:hover{background:var(--surface)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.pri:hover{background:#3d33b8}
button.sm{height:28px;font-size:12px;padding:0 10px}
button.ghost{border-color:transparent;background:none;color:var(--muted);padding:0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:var(--r);padding:0 10px;background:var(--bg)}
input[type=text],input[type=date],input[type=number],select{height:34px}
textarea{padding:8px 10px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--bg);border-right:1px solid var(--line);padding:20px 12px}
.brand{font-weight:700;font-size:15px;padding:0 8px 18px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.nb{display:block;width:100%;text-align:left;border:0;background:none;height:38px;border-radius:var(--r);color:var(--muted)}
.nb.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:24px 28px 80px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lb{font-size:12px;color:var(--muted);margin:0 0 6px;display:block}
.pill{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap;line-height:18px}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-info{background:var(--info-soft);color:var(--info)}.t-mute{background:var(--surface2);color:var(--muted)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;margin:10px 0}
.n-info{background:var(--info-soft);color:var(--info)}.n-warn{background:var(--warn-soft);color:var(--warn)}.n-mute{background:var(--surface);color:var(--muted)}
.ico{width:16px;height:16px;flex:none;margin-top:2px}
table.tb{width:100%;border-collapse:collapse;background:var(--bg)}
.tb th,.tb td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.tb th{color:var(--muted);font-weight:500;background:var(--surface);font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.empty{font-size:13px;color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
/* edit */
.edit{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.snav{position:sticky;top:0;z-index:5;background:var(--surface);padding:8px 0 10px;display:flex;gap:6px;flex-wrap:wrap}
.snav button{height:30px;font-size:12px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;padding:0 10px}
.snav .sd{width:7px;height:7px;border-radius:50%}
.sc{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;scroll-margin-top:56px}
.sc>header{display:flex;align-items:center;gap:8px;padding:14px 18px;cursor:pointer;user-select:none}
.sc>header h2{font-size:16px;margin:0}
.sc>header .num{font-size:12px;color:var(--faint);width:18px}
.sc>header .chev{margin-left:6px;color:var(--muted);transition:transform .15s;font-size:14px}
.sc.closed>header .chev{transform:rotate(180deg)}
.sc>.sb{padding:0 18px 18px}
.sc.closed>.sb{display:none}
.sc.na{opacity:.75}
.fr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.fr:first-child{border-top:0}
.fr>.fl{font-size:13px;font-weight:500;padding-top:7px}
.fr>.fl small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.mc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcard{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--bg);text-align:left;height:auto}
.mcard.on{border:1.5px solid var(--accent);background:var(--accent-soft);padding:11.5px 13.5px}
.mcard b{display:block;font-size:14px}
.mcard span{font-size:12px;color:var(--muted)}
.mcard:disabled{background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;height:32px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{background:var(--surface);color:var(--faint)}
.radio{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;margin-right:18px}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.ae{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}
.ae.single{grid-template-columns:minmax(0,1fr)}
.al{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.ai{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:6px;cursor:pointer}
.ai.on{border:1.5px solid var(--accent);padding:7.5px}
.ai.off .nm b{color:var(--faint);text-decoration:line-through}
.ai .nm{flex:1;min-width:0}
.ai .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai .nm small{font-size:11px;color:var(--muted)}
.ar{border:0;background:none;padding:0;height:16px;width:18px;color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:10px}
.ar:disabled{opacity:.25}
.ad{border:1px solid var(--line);border-radius:10px;padding:16px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.st{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.st small{font-weight:400;color:var(--muted);font-size:12px}
.po{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.po-h{display:flex;align-items:center;gap:8px}
.po-h b{font-size:13px}
.po-meta{font-size:12px;color:var(--muted)}
.po-body{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.ps-r{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:2px 0}
.ps-r .nm{flex:1}
.ro{font-size:11px;color:var(--faint)}
.sum{background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:10px}
.sum b{color:var(--accent)}
.oc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.vc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 6px 0 10px;border:1px solid var(--line2);border-radius:14px;font-size:12px;margin:0 4px 4px 0;background:var(--bg)}
.vc button{border:0;height:auto;padding:0;background:none;color:var(--faint);font-size:14px;line-height:1}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);display:inline-block}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th,.mt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.mt th{font-size:12px;color:var(--muted);font-weight:500}
.mt select{width:100%;height:30px;font-size:12px}
.fb{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.ng{background:var(--warn-soft);color:var(--warn)}
.fb a{color:inherit;text-decoration:underline;cursor:pointer}
.er{font-size:12px;color:var(--warn);margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.04);z-index:4}
/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 12px;border-radius:15px;font-size:12px;font-weight:600;border:1.5px solid transparent;cursor:pointer}
.bd.sel{outline:2px solid var(--accent-line);outline-offset:2px}
.bd .x{border:0;background:none;color:inherit;height:auto;padding:0;opacity:.8;font-size:14px}
.bdm{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid transparent}
.addb{width:30px;height:30px;padding:0;border-radius:var(--r);color:var(--muted)}
.bed{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.cs{width:24px;height:24px;border-radius:50%;cursor:pointer;border:0;padding:0;color:#fff;font-size:12px}
.cs.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
/* toggle */
.tg{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line2);border:0;padding:0;cursor:pointer;flex:none}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--accent)}.tg.on::after{left:16px}
.src{font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.s-link{background:var(--info-soft);color:var(--info)}.s-copy{background:var(--surface2);color:var(--muted)}.s-none{background:var(--warn-soft);color:var(--warn)}
.bx{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);font-size:13px;line-height:1.7;white-space:pre-line}
/* preview */
.pvw{position:sticky;top:16px}
.phone{background:var(--bg);border:1px solid var(--line2);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.ph-h{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.ph-b{padding:12px 14px;overflow:auto;flex:1}
.ph-f{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.pimg{height:120px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;margin-bottom:10px}
.step{margin-bottom:16px}
.step-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:8px}
.step-h .n{width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.step-h small{font-weight:400;color:var(--muted);margin-left:auto;font-size:11px}
.pc{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;background:var(--bg)}
.pc.on{border:1.5px solid var(--text);padding:9.5px 11.5px}
.pc.dis{opacity:.45;cursor:not-allowed}
.pc.fix{cursor:default;background:var(--surface)}
.pc-h{display:flex;align-items:center;gap:8px;font-size:13px}
.pc-h b{flex:1}
.pc-p{font-size:13px;font-weight:600;white-space:nowrap}
.inc{font-size:11px;color:var(--muted);margin-top:4px}
.psb{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.psb-h{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.psb-h small{margin-left:auto;font-weight:400;color:var(--muted)}
.cands{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.cd{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer}
.cd:last-child{border-bottom:0}
.cd.dis{opacity:.45;cursor:not-allowed}
.cd .add{margin-left:auto;color:var(--muted);white-space:nowrap}
.cd.on{background:var(--accent-soft)}
.ob{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ob button{height:32px;font-size:12px;border-radius:16px;display:inline-flex;align-items:center;gap:6px}
.ob button.on{border:1.5px solid var(--text);font-weight:600}
.tot{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.tot b{font-size:16px}
.pacc{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.pacc summary{cursor:pointer;font-weight:600}
.pacc div{color:var(--muted);font-size:12px;margin-top:6px;white-space:pre-line}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,22,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.ov[hidden]{display:none}
.mbox{background:var(--bg);border-radius:14px;width:min(820px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.mbox>header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.mbody{padding:14px 18px;overflow:auto;flex:1}
.mbox>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{height:28px;border-radius:14px;font-size:12px}
.chips button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:600}
.mi{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.mi.on{border-color:var(--accent);background:var(--accent-soft)}
.mi.dis{opacity:.5;cursor:not-allowed}
.op{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px;cursor:pointer;font-size:13px}
.op.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
@media (max-width:1180px){.edit{grid-template-columns:1fr}.pvw{position:static}.phone{max-height:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav.side{display:flex;gap:6px;padding:10px}.brand{display:none}.mc{grid-template-columns:1fr}.ae{grid-template-columns:1fr}.po-body{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">상품 전시 어드민<small>프로토타입 v3 · 샘플 데이터</small></div>
    <button class="nb on" data-v="list">전시 목록</button>
    <button class="nb" data-v="new">전시 등록</button>
  </nav>
  <main id="main"></main>
</div>
<div class="ov" id="ov" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <header><div><div id="mTitle" style="font-size:16px;font-weight:600"></div><div class="pill" id="mSub"></div></div><button class="ghost" id="mClose" aria-label="닫기" style="margin-left:auto;font-size:20px">×</button></header>
  <div class="mbody" id="mBody"></div>
  <footer id="mFoot"></footer>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   EPC 샘플 데이터 (EPC 상품 조회 화면에서 내려오는 값으로 가정)
   PO: 판매 단위. dt = Delivery type(PS 목록), base = Price policy 기본가, 후보 add = 추가금
   ========================================================= */
const TODAY='2026-10-10';
const TYPES=['기기서비스','액세서리','요금제','부가서비스','구독서비스'];
const ONCE=new Set(['기기서비스','액세서리']);
function seedNum(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
const PS3_NAMES=['YouTube Premium','디즈니+','Netflix 스탠다드','티빙 스탠다드','웨이브 베이직','쿠팡플레이','밀리의서재','윌라 오디오북','FLO 무제한','멜론 스트리밍','지니뮤직','Google One 100GB','네이버플러스 멤버십','배달의민족 쿠폰팩','요기요 쿠폰팩','파리바게뜨 할인','배스킨라빈스 할인','도미노피자 쿠폰','CGV 예매 할인','메가박스 예매 할인','교보문고 sam','리디셀렉트','클래스101','야놀자 할인','여기어때 할인','카카오T 블루 할인','쏘카 할인','GS25 할인','CU 할인','이마트24 할인'];
for(let i=PS3_NAMES.length+1;i<=50;i++) PS3_NAMES.push('제휴 쿠폰팩 '+String(i-30).padStart(2,'0'));
const PS3_ADD=n=>n==='YouTube Premium'||n==='디즈니+'?7900:[0,1000,2000,3900,4900,5900][seedNum(n)%6];
let EPCN=3370;
const mk=(o)=>Object.assign({epc:String(++EPCN).padStart(6,'0'),ver:'v1.0',sale:'판매중',img:[o.id.toLowerCase()+'_main.png']},o);
const PO=[
 mk({id:'SUB-001',name:'T우주 편의점&카페',type:'구독서비스',ver:'v2.0',base:9900,desc:'세븐일레븐·투썸플레이스 할인에 원하는 혜택 1개를 더하는 T우주 구독 상품입니다',dt:[
   {id:'PS1',name:'세븐일레븐',req:true,desc:'1천원당 300원 · 1일 1회 · 회당 9천원'},
   {id:'PS2',name:'투썸플레이스',req:true,desc:'최대 30% · 1일 1회 · 회당 9천원'},
   {id:'PS3',name:'선택 혜택',req:false,min:1,max:1,cands:PS3_NAMES.map(n=>({n,add:PS3_ADD(n)}))}]}),

 $('#mBody').innerHTML=`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px">
 <div><input type="text" id="tq" value="${esc(TM.q)}" placeholder="템플릿명 · 코드 검색" style="width:100%"><div class="chips">${types.map(t=>`<button class="${TM.f===t?'on':''}" data-f="${t}">${t}</button>`).join('')}</div>
 ${L.map(t=>{ const dis=used.has(t.id); return `<div class="mi ${TM.sel.has(t.id)?'on':''} ${dis?'dis':''}" data-t="${t.id}"><input type="checkbox" ${TM.sel.has(t.id)||dis?'checked':''} ${dis?'disabled':''} aria-label="${esc(t.n)}"><div style="flex:1"><div class="row" style="gap:6px"><b style="font-size:13px">${esc(t.n)}</b><span class="tag t-mute">${t.t}</span></div><div class="po-meta">${t.id} · ${t.v}${dis?' · 이미 추가됨':''}</div></div></div>`; }).join('')||'<div class="empty">검색 결과가 없어요</div>'}</div>
 <div style="background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column"><div class="pill">미리보기</div><div class="row" style="margin:4px 0 2px"><b style="font-size:15px">${esc(f.t)}</b><span class="tag t-mute">${f.id} · ${f.v}</span></div><div class="pill" style="margin-bottom:8px">전시 ${f.use}곳에서 사용 중</div><div class="bx" style="background:var(--bg);margin-bottom:12px">${esc(f.body)}</div>
 <div class="lb">가져오는 방식</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['link','연결해서 사용','수정 불가. 템플릿이 바뀌면 이 전시도 같이 바뀌어요'],['copy','복사해서 사용','지금 내용을 가져와 고쳐 써요. 이후 변경은 반영 안 돼요']].map(([k,t,s])=>`<button class="mcard ${TM.mode===k?'on':''}" data-tm="${k}"><b style="font-size:13px">${t}</b><span>${s}</span></button>`).join('')}</div></div></div>`;
 $('#tq').oninput=e=>{ TM.q=e.target.value.trim(); const p=e.target.selectionStart; drawTpl(); const n=$('#tq'); n.focus(); n.setSelectionRange(p,p); };
 $$('#mBody [data-f]').forEach(b=>b.onclick=()=>{ TM.f=b.dataset.f; drawTpl(); });
 $$('#mBody [data-t]').forEach(el=>el.onclick=()=>{ const id=el.dataset.t; TM.focus=id; if(!used.has(id)) TM.sel.has(id)?TM.sel.delete(id):TM.sel.add(id); drawTpl(); });
 $$('#mBody [data-tm]').forEach(b=>b.onclick=()=>{ TM.mode=b.dataset.tm; drawTpl(); });
 const n=TM.sel.size;
 $('#mFoot').innerHTML=`<span class="pill">${n?`선택 ${n}개 · ${TM.mode==='link'?'연결':'복사'}해서 목록 끝에 붙어요`:'템플릿을 1개 이상 고르세요'}</span><button id="mc" style="margin-left:auto">취소</button><button class="pri" id="mo" ${n?'':'disabled'}>${n?n+'개 추가':'추가'}</button>`;
 $('#mc').onclick=closeModal;
 $('#mo').onclick=()=>{ TM.sel.forEach(id=>{ const t=tplBy(id); const x={id:nid(),t:t.t,mode:TM.mode,src:id,show:true,txt:TM.mode==='copy'?t.body:''}; E.extras.push(x); curX=x.id; }); closeModal(); rExtra(); refresh(); toast(`템플릿 ${n}개를 추가했어요`); };
}

/* =========================================================
   고객 화면 미리보기
   ========================================================= */
function pvOf(a){ let p=PV[a.id]; if(!p){ p=PV[a.id]={pick:[],opt:{},ps:{},q:{}};
  if(a.mode==='list'){ const r=rng(a), d=(a.def||[]).filter(id=>a.pos.includes(id)).slice(0,r.hi); p.pick=d.length?d:(r.lo>0?a.pos.slice(0,r.lo):[]); }
  if(a.mode==='opt') a.opts.filter(o=>o.name.trim()&&o.vals.length).forEach(o=>p.opt[o.name]=o.vals[0]); }
 p.pick=p.pick.filter(id=>a.pos.includes(id)); return p; }
function activePOs(a){ const p=pvOf(a);
 if(a.mode==='fixed') return a.pos.slice();
 if(a.mode==='list') return p.pick.slice();
 const os=a.opts.filter(o=>o.name.trim()&&o.vals.length); if(!os.length) return []; const id=a.map[os.map(o=>p.opt[o.name]).join('|')]; return id&&a.pos.includes(id)?[id]:[]; }
function psPicks(a,poId,ps){ const p=pvOf(a); p.ps[poId]=p.ps[poId]||{}; if(!p.ps[poId][ps.id]) p.ps[poId][ps.id]=[]; return p.ps[poId][ps.id]; }
function psBlock(a,po){
 return selPS(po).map(ps=>{ const picks=psPicks(a,po.id,ps), one=ps.max===1, full=picks.length>=ps.max, many=ps.cands.length>8, key=po.id+ps.id, q=(pvOf(a).q[key]||'');
  return `<div class="psb"><div class="psb-h">${esc(ps.name)}<small>${one?'1개 선택':`${picks.length}/${ps.max} 선택${ps.min&&ps.min!==ps.max?` · 최소 ${ps.min}개`:''}`}</small></div>
  ${many?`<input type="text" data-pq="${a.id}|${key}" value="${esc(q)}" placeholder="${ps.cands.length}개 중 검색" style="width:100%;height:30px;font-size:12px;margin-bottom:6px">`:''}
  <div class="cands">${ps.cands.map((c,ci)=>{ const on=picks.includes(ci), dis=!on&&full&&!one; return `<label class="cd ${on?'on':''} ${dis?'dis':''}" data-cn="${esc(c.n)}" ${q&&!c.n.toLowerCase().includes(q.toLowerCase())?'style="display:none"':''}><input type="${one?'radio':'checkbox'}" name="r${a.id}${key}" data-ps="${a.id}|${po.id}|${ps.id}|${ci}" ${on?'checked':''} ${dis?'disabled':''}><span>${esc(c.n)}</span><span class="add">${c.add?'+'+won(c.add):'추가금 없음'}</span></label>`; }).join('')}</div>
  ${picks.length<ps.min?`<div class="er">${ps.min-picks.length}개 더 골라야 해요</div>`:''}</div>`; }).join('');
}
function poPrice(a,po){ let s=po.base; selPS(po).forEach(ps=>psPicks(a,po.id,ps).forEach(ci=>s+=ps.cands[ci].add)); return s; }
const inc=po=>{ const r=po.dt.filter(p=>p.req); return r.length?`<div class="inc">포함: ${r.map(p=>esc(p.name)+(p.desc?` (${esc(p.desc)})`:'')).join(' · ')}</div>`:''; };
const pp=(a,po,on)=>`${ONCE.has(po.type)?'':'월 '}${won(on===false?po.base:poPrice(a,po))}`;
function renderPreview(){
 const B=$('#pvB'); if(!B) return;
 const sc=B.scrollTop, lists=$$('.cands').map(x=>x.scrollTop);
 let h=`<div class="pimg">${E.images.length?`대표 이미지 ${E.images.length}장 · ${esc(E.images[0])}`:'대표 이미지 없음'}</div>
 ${E.badges.length?`<div class="row" style="gap:4px;margin-bottom:6px">${E.badges.map(b=>`<span class="bdm" style="${bstyle(b)}">${esc(b.t)}</span>`).join('')}</div>`:''}
 <div style="font-size:17px;font-weight:700">${esc(E.name)||'전시명 미입력'}</div>${E.summary?`<div class="pill">${esc(E.summary)}</div>`:''}<div style="height:12px"></div>`;
 if(E.kind==='ps'){ h+=E.conn.map(k=>{ const s=psBy(k); return `<div class="pc fix"><div class="pc-h"><b>${esc(s.name)}</b><span class="tag t-mute">${s.kind}</span></div><div class="inc">${esc(s.po.name)}에 포함된 서비스 · ${esc(s.desc||'')}</div></div>`; }).join('')||'<div class="empty">PS를 연결하면 여기에 보여요</div>'; if(E.conn.length) h+=`<div class="pill" style="margin:6px 0 14px">가입은 ${esc(psBy(E.conn[0]).po.name)} 상품에서 할 수 있어요 ›</div>`; }
 else E.areas.forEach((a,i)=>{ const p=pvOf(a), r=rng(a);
  const hint=a.mode==='fixed'?'모두 제공':a.mode==='opt'?'옵션 선택':(r.hi===1?(r.lo?'1개 선택':'1개 선택 · 선택 안 함 가능'):`${p.pick.length}/${r.hi} 선택${r.lo?` · 최소 ${r.lo}개`:''}`);
  h+=`<div class="step"><div class="step-h"><span class="n">${i+1}</span>${esc(a.name)||'이름 없음'}<small>${hint}</small></div>`;
  if(!a.pos.length){ h+='<div class="empty">PO를 배정하면 여기에 보여요</div></div>'; return; }
  if(a.mode==='fixed') a.pos.forEach(id=>{ const po=poBy(id); h+=`<div class="pc fix"><div class="pc-h"><span class="tag t-ok">포함</span><b>${esc(po.name)}</b><span class="pc-p">${pp(a,po)}</span></div>${inc(po)}${psBlock(a,po)}</div>`; });
  if(a.mode==='list'){ const one=r.hi===1, full=p.pick.length>=r.hi;
   a.pos.forEach(id=>{ const po=poBy(id), on=p.pick.includes(id), dis=!on&&full&&!one; h+=`<div class="pc ${on?'on':''} ${dis?'dis':''}" data-lp="${a.id}|${id}" role="${one?'radio':'checkbox'}" aria-checked="${on}" tabindex="0"><div class="pc-h"><span aria-hidden="true">${one?(on?'◉':'○'):(on?'☑':'☐')}</span><b>${esc(po.name)}</b><span class="pc-p">${pp(a,po,on)}</span></div>${on?inc(po)+psBlock(a,po):(hasSel(po)?'<div class="inc">고르면 선택 항목이 열려요</div>':'')}</div>`; });
   if(!r.lo) h+=`<div class="pc ${p.pick.length?'':'on'}" data-none="${a.id}" style="border-style:dashed" tabindex="0"><div class="pc-h"><span aria-hidden="true">${p.pick.length?'○':'◉'}</span><b>선택 안 함</b></div></div>`;
   if(p.pick.length<r.lo) h+=`<div class="er">${r.lo-p.pick.length}개 더 골라야 다음으로 넘어가요</div>`; }
  if(a.mode==='opt'){ const os=a.opts.filter(o=>o.name.trim()&&o.vals.length);
   os.forEach(o=>{ h+=`<div class="lb" style="margin-top:4px">${esc(o.name)} <b style="color:var(--text)">${esc(p.opt[o.name]||'')}</b></div><div class="ob">${o.vals.map(v=>`<button class="${p.opt[o.name]===v?'on':''}" data-ov="${a.id}|${esc(o.name)}|${esc(v)}">${o.disp==='chip'?`<span class="sw" style="background:${COLOR[v]||'#bbb'}"></span>`:''}${esc(v)}</button>`).join('')}</div>`; });
   const ap=activePOs(a);
   if(ap.length){ const po=poBy(ap[0]); h+=`<div class="pc on fix"><div class="pc-h"><b>${esc(po.name)}</b><span class="pc-p">${pp(a,po)}</span></div>${inc(po)}${psBlock(a,po)}</div>`; }
   else h+=`<div class="empty">${os.length?'이 조합은 준비 중이에요 (매핑 필요)':'옵션을 만들면 여기에 보여요'}</div>`; }
  h+='</div>'; });
 if(E.desc.trim()) h+=`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:4px"><div style="font-size:13px;font-weight:600;margin-bottom:4px">상품 설명</div><div class="pill" style="white-space:pre-line">${esc(E.desc.length>160?E.desc.slice(0,160)+'…':E.desc)}</div></div>`;
 const xs=E.extras.filter(x=>x.show&&(x.mode==='link'||x.txt.trim()));
 h+=xs.map(x=>`<details class="pacc"><summary>${esc(x.t)||'제목 없음'}</summary><div>${esc(x.mode==='link'?tplBy(x.src).body:x.txt)}</div></details>`).join('');
 B.innerHTML=h;
 let mon=0, once=0, left=0;
 if(E.kind==='po') E.areas.forEach(a=>{ activePOs(a).forEach(id=>{ const po=poBy(id), v=poPrice(a,po); ONCE.has(po.type)?once+=v:mon+=v; selPS(po).forEach(ps=>{ const n=psPicks(a,id,ps).length; if(n<ps.min) left+=ps.min-n; }); }); const r=rng(a); if(r&&pvOf(a).pick.length<r.lo) left+=r.lo-pvOf(a).pick.length; });
 $('#pvF').innerHTML=E.kind==='ps'?'<div class="pill">소개용 전시라 금액과 주문 버튼이 없어요</div>':`${once?`<div class="tot"><span>기기·액세서리</span><b>${won(once)}</b></div>`:''}<div class="tot"><span>월 요금</span><b>${won(mon)}</b></div><div class="pill" style="margin-top:4px">${left?`<span style="color:var(--warn)">선택이 ${left}개 남았어요</span>`:'Price policy 기준 계산 · 전시에서 가격을 입력하지 않아요'}</div>`;
 B.scrollTop=sc; $$('.cands').forEach((x,i)=>x.scrollTop=lists[i]||0);
 $$('[data-lp]').forEach(el=>{ const go=e=>{ if(e.target.closest('.psb'))return; const [aid,id]=el.dataset.lp.split('|'); const a=E.areas.find(x=>x.id===+aid), p=pvOf(a), r=rng(a); if(r.hi===1){ p.pick=(p.pick[0]===id&&!r.lo)?[]:[id]; } else if(p.pick.includes(id)) p.pick=p.pick.filter(x=>x!==id); else if(p.pick.length<r.hi) p.pick.push(id); else { toast(`최대 ${r.hi}개까지 고를 수 있어요`); return; } renderPreview(); };
  el.onclick=go; el.onkeydown=e=>{ if(e.target===el&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); go(e); } }; });
 $$('[data-none]').forEach(el=>el.onclick=()=>{ pvOf(E.areas.find(x=>x.id===+el.dataset.none)).pick=[]; renderPreview(); });
 $$('[data-ov]').forEach(b=>b.onclick=()=>{ const [aid,on,v]=b.dataset.ov.split('|'); pvOf(E.areas.find(x=>x.id===+aid)).opt[on]=v; renderPreview(); });
 $$('[data-ps]').forEach(c=>c.onchange=()=>{ const [aid,poId,psId,ci]=c.dataset.ps.split('|'); const a=E.areas.find(x=>x.id===+aid), po=poBy(poId), ps=po.dt.find(x=>x.id===psId), arr=psPicks(a,poId,ps), n=+ci;
  if(ps.max===1) arr.splice(0,arr.length,n); else if(c.checked){ if(arr.length<ps.max) arr.push(n); } else arr.splice(arr.indexOf(n),1); renderPreview(); });
 $$('[data-pq]').forEach(t=>t.oninput=()=>{ const [aid,key]=t.dataset.pq.split('|'); pvOf(E.areas.find(x=>x.id===+aid)).q[key]=t.value; const q=t.value.trim().toLowerCase(); t.nextElementSibling.querySelectorAll('.cd').forEach(r=>r.style.display=!q||r.dataset.cn.toLowerCase().includes(q)?'':'none'); });
}

/* 저장 */
function save(){
 const d=clone(E); if(!d.id){ d.id=Math.max(0,...DISPLAYS.map(x=>x.id))+1; DISPLAYS.unshift(d); } else DISPLAYS[DISPLAYS.findIndex(x=>x.id===d.id)]=d;
 const n=blocking(d).length; goList(); toast(n?`저장했어요. 필수 확인 ${n}건이 남아 '작성 중'으로 표시돼요`:'저장했어요');
}

goList();
</script>
</body>
</html>
