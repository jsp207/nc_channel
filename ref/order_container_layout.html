<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 컨테이너 레이아웃 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 문서 상단에 문제 정의, 시안 전환 탭, 시안별 실동작 목업(미리보기 좌측 / 설정 우측), 하단 비교표 */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F1F2F7; --line:#E1E3EB; --line-2:#ECEEF3;
  --fg:#16171E; --muted:#686C7D; --faint:#9A9DAB;
  --accent:#3B3BE3; --accent-soft:#ECECFD; --accent-fg:#FFFFFF;
  --prod:#6B3FD6; --prod-soft:#F1ECFD; --order:#1D6BDB; --order-soft:#E7F0FD; --none:#585C6B; --none-soft:#ECEDF1;
  --warn:#B4610A; --warn-soft:#FDF1E2;
  --phone:#1B1C22; --screen:#FAFAFC;
  --shadow:0 12px 32px rgba(22,23,40,.14);
  --f-body:"Pretendard","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F14; --surface:#17181F; --surface-2:#1F2129; --line:#2B2E39; --line-2:#24262F;
  --fg:#ECEDF3; --muted:#9EA1B0; --faint:#6E7181;
  --accent:#8A8AFF; --accent-soft:#25264A; --accent-fg:#0E0F14;
  --prod:#B49BFF; --prod-soft:#2B2445; --order:#7DB0FF; --order-soft:#1C2A42; --none:#B3B6C3; --none-soft:#2A2C35;
  --warn:#F0A65A; --warn-soft:#3A2A17;
  --phone:#05060A; --screen:#1C1D24; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F14; --surface:#17181F; --surface-2:#1F2129; --line:#2B2E39; --line-2:#24262F;
  --fg:#ECEDF3; --muted:#9EA1B0; --faint:#6E7181;
  --accent:#8A8AFF; --accent-soft:#25264A; --accent-fg:#0E0F14;
  --prod:#B49BFF; --prod-soft:#2B2445; --order:#7DB0FF; --order-soft:#1C2A42; --none:#B3B6C3; --none-soft:#2A2C35;
  --warn:#F0A65A; --warn-soft:#3A2A17;
  --phone:#05060A; --screen:#1C1D24; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:24px;padding-block:32px 64px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* 문서 영역 */
.doc-head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
h1{font-size:26px;line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
.lead{margin:0;color:var(--muted);max-width:72ch}
.problems{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.prob{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;gap:14px}
.prob .tag{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px;height:fit-content}
.prob h3{margin:0 0 4px;font-size:15px}
.prob p{margin:0;color:var(--muted);font-size:13.5px}

.switch{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px}
.switch button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.switch button b{font-family:var(--f-mono);font-weight:500;font-size:12px;border-radius:4px;padding:0 6px;background:var(--surface-2)}
.switch button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.switch button[aria-selected="true"] b{background:var(--accent);color:var(--accent-fg)}
.switch .rec{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.switch button[aria-selected="true"] .rec{background:var(--accent);color:var(--accent-fg)}

.optdesc{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.optdesc>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.optdesc h2{margin:0 0 6px;font-size:18px}
.optdesc h4{margin:0 0 6px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.optdesc p{margin:0;font-size:13.5px}
.optdesc ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.hint-line{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hint-line kbd{font-family:var(--f-mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px}

.stage{overflow-x:auto;border-radius:14px}
.app{min-width:1180px;display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.pane-h h3{margin:0;font-size:18px;font-weight:700}
.ghost-btn{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.ghost-btn:hover{border-color:var(--faint);color:var(--fg)}
.pri-btn{background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}

/* 미리보기 */
.preview-bg{background:var(--surface-2);border-radius:12px;padding:24px 0 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:286px;height:560px;border-radius:40px;background:var(--phone);padding:9px;box-shadow:var(--shadow)}
.screen{height:100%;border-radius:32px;background:var(--screen);overflow:hidden;display:flex;flex-direction:column}
.p-top{padding:22px 18px 10px;flex:none}
.p-step{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--accent)}
.p-step span:last-child{color:var(--faint);font-family:var(--f-mono);font-weight:500}
.p-prog{display:flex;gap:3px;margin-top:6px}
.p-prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.p-prog i.on{background:var(--accent)}
.p-body{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:8px;position:relative;scrollbar-width:thin}
.pb{border-radius:12px;padding:10px 10px 11px;border:2px solid transparent;cursor:pointer;transition:border-color .15s}
.pb:hover{border-color:var(--line)}
.pb.sel{border-color:var(--accent);background:var(--accent-soft)}
.pq{margin:0 0 6px;font-size:12.5px;font-weight:700}
.popt{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:11px;margin-top:5px;color:var(--fg)}
.pline{height:8px;border-radius:4px;background:var(--line);margin-top:6px}
.pline.short{width:60%}
.pcard{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:9px}
.pcard i{width:38px;height:46px;border-radius:7px;background:linear-gradient(160deg,var(--line),var(--surface-2));flex:none}
.pcard b{font-size:11.5px;display:block}
.pcard small{font-size:10.5px;color:var(--muted)}
.pb.ghost{border:1.5px dashed var(--faint);text-align:center;font-size:11px;color:var(--muted);padding:12px 8px}
.pb.ghost.sel{border:2px solid var(--accent)}
.pb.ghost b{display:block;color:var(--fg);font-weight:600}
.p-foot{flex:none;padding:10px 14px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line-2)}
.p-foot span{flex:1;text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:10px;font-size:12.5px;font-weight:600}
.p-foot em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.p-cap{font-size:12px;color:var(--muted)}

/* 공통 코너 행 */
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.badge.prod{color:var(--prod);background:var(--prod-soft)}
.badge.order{color:var(--order);background:var(--order-soft)}
.badge.none{color:var(--none);background:var(--none-soft)}
.clist{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px}
.crow{display:grid;grid-template-columns:14px 24px auto minmax(0,1fr) auto 24px;align-items:center;gap:10px;background:var(--surface);border:1.5px solid transparent;border-radius:10px;padding:10px 10px;cursor:pointer}
.crow:hover{border-color:var(--line)}
.crow.sel{border-color:var(--accent)}
.grip{color:var(--faint);font-size:11px;letter-spacing:-2px;cursor:grab}
.num{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:5px;text-align:center;line-height:22px}
.cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cid{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.x{color:var(--faint);font-size:17px;line-height:1;border-radius:6px;height:24px}
.x:hover{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600}
.field label sup{color:#E5484D}
.field input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit}
.sec-l{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px}
.sec-l small{font-weight:400;color:var(--muted);font-size:12px}
.foot-r{display:flex;justify-content:flex-end;margin-top:14px}

/* 상세 패널 내용 (공통) */
.dt{display:grid;grid-template-columns:88px 1fr;font-size:13px}
.dt dt,.dt dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line-2)}
.dt dt{color:var(--muted)}
.dt dd{font-weight:500;min-width:0}
.dt dd code{font-family:var(--f-mono);font-size:12.5px}
.dsec{margin-top:18px}
.dsec h5{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.dsec h5 button{font-size:12px;color:var(--accent);font-weight:600}
.dsec p{margin:0;font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.chk i{width:16px;height:16px;border-radius:4px;background:var(--accent);position:relative;flex:none}
.chk i::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cond{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted)}

/* A안 */
.a-bar{display:flex;gap:8px;align-items:stretch;margin-bottom:16px;position:relative}
.dd-btn{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;background:var(--surface);text-align:left;min-width:0}
.dd-btn .stepn{font-family:var(--f-mono);font-size:12px;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:1px 7px}
.dd-btn .tn{font-weight:700;font-size:15px}
.dd-btn .tc{color:var(--muted);font-size:12.5px;margin-left:auto}
.dd-btn .chev{transition:transform .15s}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sq{width:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;color:var(--muted)}
.sq:hover:not(:disabled){color:var(--fg);border-color:var(--faint)}
.sq:disabled{opacity:.35;cursor:default}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:96px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:10}
.dd-item{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.dd-item:hover{background:var(--surface-2)}
.dd-item.cur{background:var(--accent-soft)}
.dd-item .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dd-item .nm{font-weight:600}
.dd-item .ct{font-size:12px;color:var(--muted)}
.dd-item .gr{color:var(--faint);font-size:11px;letter-spacing:-2px}
.dd-add{border-top:1px solid var(--line-2);margin-top:4px;padding-top:4px}
.dd-add button{width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--accent);font-weight:600}
.dd-add button:hover{background:var(--accent-soft)}
.inline-d{background:var(--surface);border:1.5px solid var(--accent);border-top:0;border-radius:0 0 10px 10px;margin-top:-8px;padding:6px 16px 16px}
.crow.sel.open{border-radius:10px 10px 0 0}

/* B안 */
.b-list{display:flex;flex-direction:column;gap:8px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.acc.open{border-color:var(--accent)}
.acc-h{display:grid;grid-template-columns:14px 30px 1fr auto auto 20px;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.acc-h .stepn{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:5px;text-align:center;line-height:22px}
.acc.open .acc-h .stepn{background:var(--accent);color:var(--accent-fg)}
.acc-h .tn{font-weight:700;font-size:14.5px}
.acc-h .mini{display:flex;gap:3px}
.acc-h .mini i{width:6px;height:14px;border-radius:2px}
.mini .prod{background:var(--prod)} .mini .order{background:var(--order)} .mini .none{background:var(--faint)}
.acc-h .tc{color:var(--muted);font-size:12.5px;white-space:nowrap}
.acc-h .chev{color:var(--muted);transition:transform .15s}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{padding:2px 14px 14px}
.b-settings{position:relative;overflow:hidden}
.drawer{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 32px rgba(22,23,40,.12);padding:22px 22px;transform:translateX(105%);transition:transform .22s ease;z-index:5;overflow-y:auto}
.drawer.on{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.drawer-h h3{margin:0;font-size:17px}
.drawer-crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.b-guide{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin-bottom:12px}

/* C안 */
.c-settings{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:0;padding:0;overflow:visible}
.c-col{padding:22px 20px;min-width:0}
.c-col+.c-col{border-left:1px solid var(--line-2)}
.rail{display:flex;flex-direction:column;position:relative}
.rail-i{position:relative}
.rail-b{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:8px 6px;border-radius:8px}
.rail-b:hover{background:var(--surface-2)}
.rail-b .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);position:relative;z-index:1}
.rail-i.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rail-i.cur .rail-b{background:var(--accent-soft)}
.rail-b .nm{font-weight:600;font-size:13.5px;display:block;line-height:1.3}
.rail-b .ct{font-size:11.5px;color:var(--muted)}
.rail-i:not(:last-of-type)::before{content:"";position:absolute;left:18.5px;top:34px;bottom:-8px;width:1.5px;background:var(--line)}
.pop{position:absolute;left:calc(100% + 8px);top:0;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;z-index:15;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.rail-i:hover .pop,.rail-b:focus-visible+.pop{opacity:1;visibility:visible}
.pop h6{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between}
.pop h6 span{color:var(--muted);font-weight:400}
.pop ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12px}
.pop li{display:flex;gap:6px;align-items:center}
.pop li .badge{font-size:10px;padding:1px 5px}
.pop .more{color:var(--muted);font-size:11.5px;margin-top:6px}
.rail-add{margin-top:10px;border:1px dashed var(--line);border-radius:8px;padding:8px;color:var(--accent);font-weight:600;font-size:13px;width:100%}
.summary h4{margin:0 0 4px;font-size:16px}
.summary .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 8px}
.stack i.prod{background:var(--prod)} .stack i.order{background:var(--order)} .stack i.none{background:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:8px;height:8px;border-radius:2px}
.legend b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.empty-cta{margin-top:18px;border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--muted)}
.empty-cta b{display:block;color:var(--fg);margin-bottom:2px}
.nonscreen{margin-top:16px}
.nonscreen ul{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.backlink{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:10px;display:inline-block}

/* 비교표 */
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.cmp table{width:100%;border-collapse:collapse;min-width:760px;font-size:13.5px}
.cmp th,.cmp td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
.cmp thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.cmp tbody th{font-weight:600;width:180px}
.cmp td.best{color:var(--accent);font-weight:600}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.verdict{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:18px 20px}
.verdict h3{margin:0 0 6px;font-size:16px}
.verdict p{margin:0;max-width:90ch}
.verdict p+p{margin-top:8px;color:var(--muted)}

@media (max-width:900px){.optdesc{grid-template-columns:1fr}}
@media (max-width:480px){body{padding-inline:16px}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">

  <nav class="switch" role="tablist" aria-label="시안 선택">
    <button role="tab" id="tab-a" aria-selected="true" data-opt="a"><b>A</b>드롭다운 + 인라인 상세</button>
    <button role="tab" id="tab-b" aria-selected="false" data-opt="b"><b>B</b>접기/펼치기 + 드로어</button>
    <button role="tab" id="tab-c" aria-selected="false" data-opt="c"><b>C</b>세로 스텝 + 마우스오버<span class="rec">추천</span></button>
  </nav>

  <!-- A안 -->
  <section class="opt" id="opt-a" role="tabpanel" aria-labelledby="tab-a">
    <div class="stage"><div class="app" data-root="a"></div></div>
  </section>

  <!-- B안 -->
  <section class="opt" id="opt-b" role="tabpanel" aria-labelledby="tab-b" hidden>
    <div class="stage"><div class="app" data-root="b"></div></div>
  </section>

  <!-- C안 -->
  <section class="opt" id="opt-c" role="tabpanel" aria-labelledby="tab-c" hidden>
    <div class="stage"><div class="app" data-root="c"></div></div>
  </section>
</div>

<script>
const TPL = [
  {name:'주문 진행', corners:[
    {name:'상품 정보 표시',type:'prod',card:['iPhone 17 Pro 256GB','코스믹 오렌지 · 출고가 1,780,000원']},
    {name:'본인/타인 사전 확인',type:'order',q:'어떤 분이 사용할 휴대폰인가요?',opts:['직접 사용','다른 사람이 사용']},
    {name:'본인/로그인 여부 확인',type:'none'},
    {name:'가입유형 선택',type:'order',q:'어떻게 가입할까요?',opts:['신규가입','번호이동','기기변경']},
    {name:'기기 납부 방식 선택',type:'order',q:'기기값은 어떻게 낼까요?',opts:['24개월 할부','일시불']},
    {name:'요금제 선택',type:'prod',q:'요금제를 골라 주세요',opts:['5GX 프라임','5GX 플래티넘']},
    {name:'약정/지원방식 선택',type:'order',q:'할인 방식을 골라 주세요',opts:['선택약정 24개월','공시지원금']},
    {name:'SIM 유형 선택',type:'order',q:'SIM 유형',opts:['eSIM','USIM']},
    {name:'T기프트 선택',type:'prod',q:'T기프트를 골라 주세요'},
    {name:'티다팩 선택',type:'prod',q:'티다팩 추가'}]},
  {name:'본인 인증', corners:[
    {name:'휴대폰 본인인증',type:'order',q:'본인인증을 진행해 주세요',opts:['휴대폰 인증','공동인증서']},
    {name:'미성년자 여부 확인',type:'none'},
    {name:'법정대리인 동의',type:'order',q:'법정대리인 동의'}]},
  {name:'배송 정보', corners:[
    {name:'배송지 입력',type:'order',q:'어디로 받으실까요?'},
    {name:'희망 개통일 선택',type:'order',q:'개통 희망일',opts:['받는 즉시 개통','날짜 지정']},
    {name:'배송 요청사항',type:'order',q:'배송 요청사항'}]},
  {name:'주문 확인', corners:[
    {name:'주문 상품 요약',type:'prod',card:['iPhone 17 Pro 256GB','5GX 프라임 · 선택약정 24개월']},
    {name:'할인·혜택 내역',type:'prod',q:'할인·혜택'},
    {name:'약관 동의',type:'order',q:'약관에 동의해 주세요',opts:['전체 동의']}]},
  {name:'결제 진행', corners:[
    {name:'결제수단 선택',type:'order',q:'결제수단',opts:['신용카드','계좌이체','T페이']},
    {name:'결제 동의',type:'order',q:'결제 진행 동의'},
    {name:'PG 결제 요청',type:'none'}]},
  {name:'주문 완료', corners:[
    {name:'주문 완료 안내',type:'order',q:'주문이 완료됐어요'},
    {name:'개통 진행 안내',type:'order',q:'개통은 이렇게 진행돼요'}]}
];
let seq=1; TPL.forEach(t=>t.corners.forEach(c=>c.id='CN-ORD-'+String(seq++).padStart(4,'0')));
const TYPE={prod:'상품 연동',order:'주문',none:'비화면'};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const badge=t=>`<span class="badge ${t}">${TYPE[t]}</span>`;
const findC=(ti,id)=>{const i=TPL[ti].corners.findIndex(c=>c.id===id);return i<0?null:{c:TPL[ti].corners[i],i}};

function phone(ti,sel){
  const t=TPL[ti],n=TPL.length;
  const blocks=t.corners.map(c=>{
    const s=c.id===sel?' sel':'';
    if(c.type==='none') return `<div class="pb ghost${s}" data-cid="${c.id}"><b>${esc(c.name)} (비화면)</b>미리보기에서만 표시하는 영역입니다.</div>`;
    if(c.card) return `<div class="pb${s}" data-cid="${c.id}"><div class="pcard"><i></i><div><b>${esc(c.card[0])}</b><small>${esc(c.card[1])}</small></div></div></div>`;
    const opts=c.opts?c.opts.map(o=>`<div class="popt">${esc(o)}</div>`).join(''):'<div class="pline"></div><div class="pline short"></div>';
    return `<div class="pb${s}" data-cid="${c.id}"><p class="pq">${esc(c.q||c.name)}</p>${opts}</div>`;
  }).join('');
  return `<div class="pane"><div class="pane-h"><h3>미리보기</h3><button class="ghost-btn" type="button">EPC 상품 불러오기</button></div>
  <div class="preview-bg"><div class="phone"><div class="screen">
    <div class="p-top"><div class="p-step"><span>${esc(t.name)}</span><span>${ti+1}/${n}</span></div>
    <div class="p-prog">${TPL.map((_,i)=>`<i class="${i<=ti?'on':''}"></i>`).join('')}</div></div>
    <div class="p-body">${blocks}</div>
    <div class="p-foot">${ti>0?'<em>이전</em>':''}<span>${ti===n-1?'확인':'다음 단계로'}</span></div>
  </div></div><span class="p-cap">iPhone 17 Pro 미리보기 중</span></div></div>`;
}
function scrollPhone(root){
  const b=root.querySelector('.p-body'),s=root.querySelector('.pb.sel');
  if(b&&s) b.scrollTop=Math.max(0,s.offsetTop-60);
}
function crow(c,i,sel,extra=''){
  return `<div class="crow${sel?' sel':''}${extra}" data-cid="${c.id}" role="button" tabindex="0" aria-pressed="${sel}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="num">${i+1}</span>${badge(c.type)}<span class="cname">${esc(c.name)}</span><span class="cid">${c.id}</span><button class="x" type="button" data-act="noop" aria-label="코너 삭제">×</button></div>`;
}
function detail(ti,c,i){
  const t=TPL[ti];
  let opt;
  if(c.type==='none') opt='<p>비화면 코너는 옵션 설정 대상이 아닙니다.</p>';
  else if(c.type==='prod') opt='<p>EPC에서 연결한 상품 기준으로 노출합니다.</p>';
  else if(c.opts) opt=c.opts.map(o=>`<div class="chk"><i></i>${esc(o)}</div>`).join('');
  else opt='<p>선택 옵션이 없는 안내형 코너입니다.</p>';
  return `<dl class="dt"><dt>코너명</dt><dd>${esc(c.name)}</dd><dt>구분</dt><dd>${badge(c.type)}</dd><dt>코너 ID</dt><dd><code>${c.id}</code></dd><dt>위치</dt><dd>${esc(t.name)} · ${i+1}번째 / 총 ${t.corners.length}개</dd></dl>
  <div class="dsec"><h5>노출 옵션</h5>${opt}</div>
  <div class="dsec"><h5>노출 조건 <button type="button" data-act="noop">+ 조건 추가</button></h5><div class="cond">설정된 조건 없음. 항상 노출됩니다.</div></div>`;
}
function counts(t){const r={prod:0,order:0,none:0};t.corners.forEach(c=>r[c.type]++);return r;}

/* ---------- A ---------- */
const A={ti:0,sel:null,dd:false};
function renderA(){
  const root=document.querySelector('[data-root="a"]'),t=TPL[A.ti];
  const list=t.corners.map((c,i)=>{
    const on=c.id===A.sel;
    return crow(c,i,on,on?' open':'')+(on?`<div class="inline-d">${detail(A.ti,c,i)}</div>`:'');
  }).join('');
  const menu=A.dd?`<div class="dd-menu" role="listbox">${TPL.map((x,i)=>`<button class="dd-item${i===A.ti?' cur':''}" type="button" data-act="pick" data-i="${i}" role="option" aria-selected="${i===A.ti}"><span class="n">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="ct">코너 ${x.corners.length}개</span><span class="gr" aria-hidden="true">⋮⋮</span></button>`).join('')}<div class="dd-add"><button type="button" data-act="noop">+ 템플릿 추가</button></div></div>`:'';
  root.innerHTML=phone(A.ti,A.sel)+`<div class="pane"><div class="pane-h"><h3>템플릿·코너 설정</h3><button class="ghost-btn" type="button">복사하기</button></div>
  <div class="a-bar"><button class="dd-btn" type="button" data-act="dd" aria-expanded="${A.dd}"><span class="stepn">${A.ti+1}/${TPL.length}</span><span class="tn">${esc(t.name)}</span><span class="tc">코너 ${t.corners.length}개</span><span class="chev" aria-hidden="true">▾</span></button>
  <button class="sq" type="button" data-act="prev" aria-label="이전 템플릿" ${A.ti===0?'disabled':''}>‹</button><button class="sq" type="button" data-act="next" aria-label="다음 템플릿" ${A.ti===TPL.length-1?'disabled':''}>›</button>${menu}</div>
  <div class="field"><label for="a-tname">템플릿명<sup>*</sup></label><input id="a-tname" value="${esc(t.name)}"></div>
  <div class="sec-l"><span>코너 설정<sup style="color:#E5484D">*</sup></span><small>코너를 누르면 아래에 상세 설정이 열립니다</small></div>
  <div class="clist">${list}</div><div class="foot-r"><button class="pri-btn" type="button">코너 추가하기</button></div></div>`;
  scrollPhone(root);
}
function onA(e){
  const act=e.target.closest('[data-act]')?.dataset.act;
  if(act==='noop'){e.stopPropagation();return;}
  if(act==='dd'){A.dd=!A.dd;return renderA();}
  if(act==='pick'){A.ti=+e.target.closest('[data-i]').dataset.i;A.sel=null;A.dd=false;return renderA();}
  if(act==='prev'||act==='next'){A.ti+=act==='prev'?-1:1;A.sel=null;A.dd=false;return renderA();}
  const cid=e.target.closest('[data-cid]')?.dataset.cid;
  if(cid){A.sel=A.sel===cid?null:cid;A.dd=false;return renderA();}
  if(A.dd&&!e.target.closest('.dd-menu')){A.dd=false;renderA();}
}

/* ---------- B ---------- */
const B={open:0,sel:null,last:0};
function renderB(){
  const root=document.querySelector('[data-root="b"]');
  const pti=B.open>=0?B.open:B.last;
  const accs=TPL.map((t,ti)=>{
    const o=ti===B.open;
    const mini=t.corners.map(c=>`<i class="${c.type}"></i>`).join('');
    const body=o?`<div class="acc-b"><div class="field"><label for="b-tname-${ti}">템플릿명<sup>*</sup></label><input id="b-tname-${ti}" value="${esc(t.name)}"></div>
      <div class="clist">${t.corners.map((c,i)=>crow(c,i,c.id===B.sel)).join('')}</div><div class="foot-r"><button class="pri-btn" type="button">코너 추가하기</button></div></div>`:'';
    return `<div class="acc${o?' open':''}"><button class="acc-h" type="button" data-act="acc" data-i="${ti}" aria-expanded="${o}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="stepn">${ti+1}</span><span class="tn">${esc(t.name)}</span><span class="mini" aria-hidden="true">${mini}</span><span class="tc">코너 ${t.corners.length}개</span><span class="chev" aria-hidden="true">▾</span></button>${body}</div>`;
  }).join('');
  const f=B.sel&&B.open>=0?findC(B.open,B.sel):null;
  const drawer=`<aside class="drawer${f?' on':''}" aria-hidden="${!f}">${f?`<div class="drawer-h"><h3>코너 상세 설정</h3><button class="x" type="button" data-act="close" aria-label="닫기">×</button></div><div class="drawer-crumb">${B.open+1}. ${esc(TPL[B.open].name)} › ${f.i+1}번째 코너</div>${detail(B.open,f.c,f.i)}`:''}</aside>`;
  root.innerHTML=phone(pti,B.sel)+`<div class="pane b-settings"><div class="pane-h"><h3>템플릿·코너 설정</h3><div style="display:flex;gap:6px"><button class="ghost-btn" type="button" data-act="all">모두 접기</button><button class="ghost-btn" type="button">복사하기</button></div></div>
  <div class="b-guide">템플릿은 주문 단계 순서대로 쌓입니다. 헤더를 드래그해 순서를 바꿉니다.</div>
  <div class="b-list">${accs}</div><button class="rail-add" type="button" style="margin-top:8px">+ 템플릿 추가</button>${drawer}</div>`;
  scrollPhone(root);
}
function onB(e){
  const el=e.target.closest('[data-act]'),act=el?.dataset.act;
  if(act==='noop'){e.stopPropagation();return;}
  if(act==='close'){B.sel=null;return renderB();}
  if(act==='all'){if(B.open>=0)B.last=B.open;B.open=-1;B.sel=null;return renderB();}
  if(act==='acc'){const i=+el.dataset.i;B.sel=null;if(B.open===i){B.last=i;B.open=-1;}else B.open=i;return renderB();}
  const cid=e.target.closest('[data-cid]')?.dataset.cid;
  if(cid){if(B.open<0)B.open=B.last;B.sel=B.sel===cid?null:cid;return renderB();}
}

/* ---------- C ---------- */
const C={ti:0,sel:null};
function renderC(){
  const root=document.querySelector('[data-root="c"]'),t=TPL[C.ti];
  const rail=TPL.map((x,i)=>{
    const top=x.corners.slice(0,5).map(c=>`<li>${badge(c.type)}${esc(c.name)}</li>`).join('');
    const more=x.corners.length>5?`<div class="more">외 ${x.corners.length-5}개</div>`:'';
    return `<div class="rail-i${i===C.ti?' cur':''}"><button class="rail-b" type="button" data-act="step" data-i="${i}" aria-current="${i===C.ti?'step':'false'}"><span class="dot">${i+1}</span><span><span class="nm">${esc(x.name)}</span><span class="ct">코너 ${x.corners.length}개</span></span></button>
    <div class="pop" role="tooltip"><h6>${esc(x.name)}<span>${x.corners.length}개</span></h6><ol>${top}</ol>${more}</div></div>`;
  }).join('');
  const f=C.sel?findC(C.ti,C.sel):null;
  let right;
  if(f){
    right=`<button class="backlink" type="button" data-act="unsel">‹ 템플릿 요약으로</button><div class="pane-h" style="margin-bottom:8px"><h3>코너 상세 설정</h3></div>${detail(C.ti,f.c,f.i)}`;
  }else{
    const k=counts(t),n=t.corners.length;
    const ns=t.corners.map((c,i)=>c.type==='none'?`<li>${i+1}. ${esc(c.name)} <span class="cid">${c.id}</span></li>`:'').join('');
    right=`<div class="summary"><span class="eyebrow">템플릿 요약</span><h4>${C.ti+1}. ${esc(t.name)}</h4><p class="sub">주문 단계 ${C.ti+1}/${TPL.length} · 코너 ${n}개</p>
      <div class="sec-l" style="margin:0"><span>코너 유형 구성</span></div>
      <div class="stack">${['prod','order','none'].map(x=>k[x]?`<i class="${x}" style="flex:${k[x]}"></i>`:'').join('')}</div>
      <div class="legend">${['prod','order','none'].map(x=>`<span><i style="background:var(--${x==='none'?'faint':x})"></i>${TYPE[x]} <b>${k[x]}</b></span>`).join('')}</div>
      <div class="nonscreen dsec"><h5>비화면 코너</h5>${ns?`<ul>${ns}</ul>`:'<p>이 템플릿에는 비화면 코너가 없습니다.</p>'}</div>
      <div class="dsec"><h5>이전·다음 단계</h5><p>${C.ti>0?`이전: ${C.ti}. ${esc(TPL[C.ti-1].name)}`:'첫 단계입니다.'}<br>${C.ti<TPL.length-1?`다음: ${C.ti+2}. ${esc(TPL[C.ti+1].name)}`:'마지막 단계입니다.'}</p></div>
      <div class="empty-cta"><b>코너를 선택하면 상세 설정이 열립니다</b>목록이나 미리보기에서 코너를 누르세요.</div></div>`;
  }
  root.innerHTML=phone(C.ti,C.sel)+`<div class="pane c-settings">
    <div class="c-col"><div class="pane-h"><h3 style="font-size:15px">주문 단계</h3></div><div class="rail">${rail}</div><button class="rail-add" type="button" data-act="noop">+ 템플릿 추가</button></div>
    <div class="c-col"><div class="pane-h"><h3>코너 설정</h3><button class="ghost-btn" type="button">복사하기</button></div>
      <div class="field"><label for="c-tname">템플릿명<sup>*</sup></label><input id="c-tname" value="${esc(t.name)}"></div>
      <div class="sec-l"><span>코너 설정<sup style="color:#E5484D">*</sup></span><small>${t.corners.length}개</small></div>
      <div class="clist">${t.corners.map((c,i)=>crow(c,i,c.id===C.sel)).join('')}</div><div class="foot-r"><button class="pri-btn" type="button">코너 추가하기</button></div></div>
    <div class="c-col">${right}</div></div>`;
  scrollPhone(root);
}
function onC(e){
  const el=e.target.closest('[data-act]'),act=el?.dataset.act;
  if(act==='noop'){e.stopPropagation();return;}
  if(act==='step'){C.ti=+el.dataset.i;C.sel=null;return renderC();}
  if(act==='unsel'){C.sel=null;return renderC();}
  const cid=e.target.closest('[data-cid]')?.dataset.cid;
  if(cid){C.sel=C.sel===cid?null:cid;return renderC();}
}

/* ---------- 바인딩 ---------- */
const H={a:onA,b:onB,c:onC};
document.querySelectorAll('[data-root]').forEach(r=>{
  const h=H[r.dataset.root];
  r.addEventListener('click',h);
  r.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.crow')){e.preventDefault();h(e);}});
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(B.sel){B.sel=null;renderB();}
  if(A.dd){A.dd=false;renderA();}
});
document.querySelectorAll('.switch [data-opt]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.switch [data-opt]').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.opt').forEach(s=>s.hidden=s.id!=='opt-'+b.dataset.opt);
  try{localStorage.setItem('ocl-opt',b.dataset.opt)}catch(_){}
}));
renderA();renderB();renderC();
try{const s=localStorage.getItem('ocl-opt');if(s)document.querySelector(`.switch [data-opt="${s}"]`)?.click();}catch(_){}
</script>

</body>
</html>
