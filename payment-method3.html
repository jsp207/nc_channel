<html lang="ko">

    <title>결제수단 기준정보 관리 | NC-Channel Product Admin</title>

  <body>
<div class="app">
<nav class="app-nav" aria-label="주 메뉴"></nav>
<main>

<!-- 결제수단 기준정보 관리 목록 v0.2.1. 스크립트는 src/payment3-list.ts, 스타일은 src/payment3-list.css(목록 공통은 src/list.css) -->
<section class="view on" id="v-list">
  <div class="breadcrumb" aria-label="현재 위치">홈 <span aria-hidden="true">›</span> 결제 관리 <span aria-hidden="true">›</span> <strong>결제수단 기준정보 관리</strong></div>
  <h1 class="lst-title">결제수단 기준정보 관리</h1>

  <!-- 조회 조건: [조회]를 눌러야 결과에 반영된다. 버튼은 마지막 줄 오른쪽 -->
  <form class="lst-filter" id="lFilter" autocomplete="off">
    <div class="lf-row">
      <span class="lf-g"><label class="lf-l" for="fPg">PG</label><select id="fPg"></select></span>
      <span class="lf-g"><label class="lf-l" for="fMethod">결제수단</label><select id="fMethod"></select></span>
      <span class="lf-g"><label class="lf-l" for="fStatus">운영상태</label><select id="fStatus"></select></span>
      <span class="lf-g"><label class="lf-l" for="fKey">키검증</label><select id="fKey"></select></span>
    </div>
    <div class="lf-row">
      <span class="lf-g"><label class="lf-l" for="fMid">MID</label><input type="text" id="fMid" placeholder="MID 코드"></span>
      <span class="lf-g"><label class="lf-l" for="fPurpose">가맹점 용도명</label><input type="text" id="fPurpose" placeholder="예) T우주"></span>
      <span class="lf-g"><label class="lf-l" for="fCh">채널</label><select id="fCh"></select></span>
      <span class="lf-g"><label class="lf-l" for="fOwner">사업주체</label><select id="fOwner"></select></span>
    </div>
    <div class="lf-row">
      <span class="lf-g"><label class="lf-l" for="fQuick">확인 항목</label><select id="fQuick"></select></span>
      <span class="lf-g lf-wide"><label class="lf-l" for="fFrom">적용기간</label><span class="lf-range"><input type="date" id="fFrom" aria-label="적용기간 시작"><span aria-hidden="true">~</span><input type="date" id="fTo" aria-label="적용기간 종료"></span></span>
      <span class="lf-acts"><button type="reset" class="btn dark">초기화</button><button type="submit" class="btn primary">조회</button></span>
    </div>
  </form>

  <div class="pm3-bar">
    <h2 class="lst-count">조회 결과 <span><b id="lCount">0</b>건 / 전체 <span id="lTotal">0</span>건</span></h2>
    <div class="pm3-tools">
      <select id="lSize" aria-label="페이지당 행 수"><option value="10">10개씩</option><option value="20">20개씩</option><option value="50">50개씩</option></select>
    </div>
  </div>

  <div class="lst-tw"><table class="lst-table" id="listTable">
    <colgroup><col class="w-pg"><col class="w-me"><col class="w-pr"><col class="w-mid"><col class="w-pu"><col class="w-se"><col class="w-fe"><col class="w-ks"><col class="w-st"><col class="w-cn"><col class="w-up"><col class="w-by"></colgroup>
    <thead><tr>
      <th>PG</th>
      <th>결제수단</th>
      <th class="c">프로모션</th>
      <th>MID</th>
      <th>가맹점 용도명</th>
      <th>정산주체</th>
      <th>수수료</th>
      <th class="c">키검증</th>
      <th class="c">운영상태</th>
      <th class="c">사용 코너</th>
      <th>수정일</th>
      <th>수정자</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <nav class="lst-pager" id="pager" aria-label="페이지"></nav>
  <div class="lst-foot"><a class="btn primary lg" href="payment-method3-create.html">결제수단 등록</a></div>
</section>

</main>
</div>
<div id="modal-root"></div>
    <script type="module" src="/src/payment3-list.ts"></script>
  </body>
</html>
