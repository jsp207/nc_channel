<!-- 이 페이지의 화면 구성은 아래 HTML에서 직접 수정하세요. 스크립트는 src/product-list.ts -->
<section class="view on" id="v-list">
  <div class="toolbar"><h1>상품목록</h1><a class="btn primary" href="product-create.html" style="margin-left:auto">상품등록</a></div>
  <p class="sub">등록한 상품을 유형·채널·상태로 찾는다. 수정을 누르면 등록 화면에 불러온다.</p>
  <div class="toolbar">
    <input type="text" id="lQ" placeholder="상품명·구성 상품 검색" style="min-width:220px" aria-label="상품명·구성 상품 검색">
    <select id="lType" aria-label="유형"><option value="">유형 전체</option></select>
    <select id="lCh" aria-label="채널"><option value="">채널 전체</option></select>
    <select id="lSt" aria-label="상태"><option value="">상태 전체</option><option value="live">전시 중</option><option value="wait">전시 예약</option><option value="off">미노출</option><option value="stop">미사용</option><option value="draft">임시저장</option></select>
    <span class="pill" id="lCnt"></span>
  </div>
  <div class="tw"><table id="listTable">
    <thead><tr><th>상품명</th><th>유형</th><th>노출채널 · 카테고리</th><th>기준 단품</th><th>슬롯</th><th>PO</th><th>기간</th><th>상태</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>

</main>
</div>
<div class="toast" id="toast"></div>
